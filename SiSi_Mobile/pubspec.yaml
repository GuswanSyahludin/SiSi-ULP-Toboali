name: sisi_mobile
description: "Aplikasi Mobile Sistem Integrasi SiSi PLN ULP Toboali"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.12.3
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  # 0.5.2 masih memakai Flutter Android v1 shim dan gagal di Flutter/AGP modern.
  # 0.10.9 mendukung AGP 9 + Built-in Kotlin dan mempertahankan API callback.
  workmanager: ^0.10.9
  image: ^4.2.0
  crypto: ^3.0.6
  # ── Project Dart: database lokal offline-first ──
  drift: ^2.28.0
  drift_flutter: ^0.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  # ── Project Dart: code generation Drift ──
  drift_dev: ^2.28.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo-sisi.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo-sisi.png"
  adaptive_icon_padding: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/loading.gif
    - assets/images/logo-sisi.png
    - assets/images/logo-pln.png
    - assets/images/bg-sisi.png
