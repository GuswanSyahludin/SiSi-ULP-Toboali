name: sisi_mobile
description: "Aplikasi Mobile Sistem Integrasi SiSi PLN ULP Toboali"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# Icon aplikasi — generate sekali dengan: dart run flutter_launcher_icons:generate
flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo-sisi.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo-sisi.png"
  adaptive_icon_padding: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/loading.gif
    - assets/images/logo-sisi.png
    - assets/images/logo-pln.png
    - assets/images/bg-sisi.png
