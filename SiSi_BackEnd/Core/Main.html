<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiSi — ULP Toboali</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ══════════════════════════════════════════════
        DESIGN TOKENS — Tema Light (default) & Dark (neon)
        Diturunkan dari warna logo SiSi:
          navy #1E3A8A · cyan #1CA0DB/#29E3FF · oranye #F5A623
      ══════════════════════════════════════════════ */
      :root {
        /* Surface & teks (Light = Slate) */
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --surface-3: #eff6ff;
        --border: #e2e8f0;
        --border-2: #f1f5f9;
        --text: #0f172a;
        --text-2: #334155;
        --text-3: #64748b;
        --text-muted: #94a3b8;
        /* Brand */
        --primary: #1e3a8a;
        --primary-2: #2563eb;
        --primary-hover: #1e40af;
        --primary-contrast: #ffffff;
        --on-primary: #ffffff;
        --info: #1ca0db;
        --accent: #f5a623;
        --success: #16a34a;
        --warning: #d97706;
        --danger: #dc2626;
        /* Top bar */
        --topbar-bg: linear-gradient(135deg, #1e3a8a, #2563eb);
        --topbar-text: #ffffff;
        --topbar-btn-bg: rgba(255, 255, 255, 0.15);
        --topbar-btn-border: rgba(255, 255, 255, 0.25);
        --topbar-btn-hover: rgba(255, 255, 255, 0.28);
        /* Splash / overlay */
        --splash-bg: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e3a8a 50%,
          #2563eb 100%
        );
        --overlay: rgba(15, 23, 42, 0.55);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        /* Bingkai warna (splash, kartu info, tombol notif) — sesuai tema */
        --splash-ring: #2563eb;
        --splash-ring-soft: #7aa5ff;
        --splash-glow: rgba(37, 99, 235, 0.45);
        --splash-card-bg: rgba(255, 255, 255, 0.1);
        --info-frame-bg: #dbe6ff;
        --topbar-card-inner: rgba(255, 255, 255, 0.15);
        --topbar-card-inner-hover: rgba(255, 255, 255, 0.3);
        --topbar-card-border: rgba(255, 255, 255, 0.25);
        --topbar-card-text: #ffffff;
        --topbar-card-text-2: rgba(255, 255, 255, 0.65);
        --topbar-card-caret: rgba(255, 255, 255, 0.7);
        --topbar-card-avatar-bg: rgba(255, 255, 255, 0.2);
        --topbar-card-avatar-text: #ffffff;
        --topbar-card-avatar-border: rgba(255, 255, 255, 0.3);
        /* Cincin animasi kartu user (kontras di atas topbar navy) */
        --topbar-card-ring: #7aa5ff;
        --topbar-card-ring-soft: #e3ecff;
      }
      [data-theme="dark"] {
        --bg: #0b1220;
        --surface: #111a2e;
        --surface-2: #0f1729;
        --surface-3: #16233d;
        --border: #1e2a44;
        --border-2: #1a2540;
        --text: #e6edf7;
        --text-2: #c4d0e4;
        --text-3: #93a4c0;
        --text-muted: #6b7c9c;
        --primary: #29e3ff;
        --primary-2: #29e3ff;
        --primary-hover: #5becff;
        --primary-contrast: #06243a;
        --on-primary: #06243a;
        --info: #5b8cff;
        --accent: #ffb23e;
        --success: #22c55e;
        --warning: #fbbf24;
        --danger: #f87171;
        --topbar-bg: linear-gradient(135deg, #0d1830, #112447);
        --topbar-text: #e6edf7;
        --topbar-btn-bg: rgba(41, 227, 255, 0.1);
        --topbar-btn-border: rgba(41, 227, 255, 0.25);
        --topbar-btn-hover: rgba(41, 227, 255, 0.2);
        --splash-bg: linear-gradient(
          135deg,
          #0b1220 0%,
          #0d1830 55%,
          #112447 100%
        );
        --overlay: rgba(2, 8, 20, 0.66);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.45);
        --splash-ring: #29e3ff;
        --splash-ring-soft: #7af5f7;
        --splash-glow: rgba(41, 227, 255, 0.5);
        --splash-card-bg: rgba(41, 227, 255, 0.06);
        --info-frame-bg: #16233d;
        --topbar-card-inner: rgba(255, 255, 255, 0.15);
        --topbar-card-inner-hover: rgba(255, 255, 255, 0.3);
        --topbar-card-border: rgba(255, 255, 255, 0.25);
        --topbar-card-text: #ffffff;
        --topbar-card-text-2: rgba(255, 255, 255, 0.65);
        --topbar-card-caret: rgba(255, 255, 255, 0.7);
        --topbar-card-avatar-bg: rgba(255, 255, 255, 0.2);
        --topbar-card-avatar-text: #ffffff;
        --topbar-card-avatar-border: rgba(255, 255, 255, 0.3);
        --topbar-card-ring: #29e3ff;
        --topbar-card-ring-soft: #7af5f7;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      /* ── Splash ── */
      @keyframes spinFrame {
        to {
          transform: rotate(360deg);
        }
      }
      #splashScreen {
        position: fixed;
        inset: 0;
        z-index: 9000;
        background: var(--splash-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        opacity: 1;
        visibility: visible;
      }
      .splash-logo-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        border-radius: 24px;
        padding: 3px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.35),
          0 0 40px var(--splash-glow);
      }
      .splash-logo-wrap::before {
        content: "";
        position: absolute;
        z-index: 0;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          from 0deg,
          transparent 0 58%,
          var(--splash-ring-soft) 74%,
          var(--splash-ring) 88%,
          transparent 99%
        );
        animation: spinFrame 2.6s linear infinite;
      }
      .splash-logo-inner {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        border-radius: 21px;
        background: var(--splash-card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      .splash-logo-wrap img {
        width: 80px;
        height: 80px;
        object-fit: contain;
        border-radius: 12px;
      }
      .splash-title {
        font-size: 0.9rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 500;
      }
      .splash-app-name {
        font-size: 2.8rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: 2px;
      }
      .splash-sub {
        font-size: 0.88rem;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 1px;
      }

      /* ── Layout ── */
      #mainContent {
        display: none;
        flex-direction: column;
        min-height: 100vh;
      }
      #topBar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--topbar-bg);
        padding: 0 20px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(30, 58, 138, 0.3);
        gap: 12px;
      }
      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .topbar-brand-logo {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.15);
        padding: 3px;
      }
      .topbar-brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .topbar-brand-name {
        font-size: 0.92rem;
        font-weight: 700;
        color: #fff;
      }
      .topbar-brand-ulp {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.65);
        letter-spacing: 0.5px;
      }
      .topbar-nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0;
        flex: 1;
        max-width: 380px;
        margin: 0 auto;
        height: 42px;
        padding: 4px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
      }
      [data-theme="dark"] .topbar-nav {
        background: rgba(41, 227, 255, 0.08);
        border-color: rgba(41, 227, 255, 0.2);
      }
      .nav-indicator {
        position: absolute;
        top: 4px;
        left: 0;
        height: calc(100% - 8px);
        width: 0;
        border-radius: 999px;
        background: #fff;
        opacity: 0;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        z-index: 0;
        pointer-events: none;
        transition:
          transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
          width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.25s ease;
      }
      [data-theme="dark"] .nav-indicator {
        background: linear-gradient(135deg, #29e3ff, #5b8cff);
        box-shadow: 0 0 16px rgba(41, 227, 255, 0.55);
      }
      .topbar-user {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .topbar-user-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--topbar-card-avatar-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--topbar-card-avatar-text);
        font-weight: 700;
        font-size: 0.85rem;
        border: 2px solid var(--topbar-card-avatar-border);
        flex-shrink: 0;
      }
      .topbar-user-info {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .topbar-user-name {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--topbar-card-text);
      }
      .topbar-user-role {
        font-size: 0.7rem;
        color: var(--topbar-card-text-2);
      }
      .btn-logout {
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn-logout:hover {
        background: rgba(220, 38, 38, 0.5);
        border-color: #dc2626;
      }
      .btn-akses {
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn-akses:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.55);
      }
      /* — Tombol ikon top bar (tema & notifikasi) — */
      .topbar-icon-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        border-radius: 9px;
        cursor: pointer;
        font-size: 0.9rem;
        transition:
          background 0.2s,
          border-color 0.2s;
        flex-shrink: 0;
      }
      .topbar-icon-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.55);
      }
      .topbar-notif-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        background: var(--danger);
        color: #fff;
        border-radius: 9px;
        font-size: 0.62rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
      }
      /* — Notifikasi dropdown — */
      .topbar-notif {
        position: relative;
        flex-shrink: 0;
      }
      .notif-dropdown {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 340px;
        max-width: 86vw;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          visibility 0.18s;
        z-index: 300;
      }
      .topbar-notif.open .notif-dropdown {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .notif-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
      }
      .notif-refresh {
        background: transparent;
        border: 0;
        color: var(--text-3);
        cursor: pointer;
        font-size: 0.85rem;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .notif-refresh:hover {
        color: var(--primary);
        background: var(--surface-3);
      }
      .notif-body {
        max-height: 380px;
        overflow-y: auto;
      }
      .notif-empty,
      .notif-loading {
        text-align: center;
        padding: 28px 16px;
        color: var(--text-3);
        font-size: 0.85rem;
      }
      .notif-item {
        display: flex;
        gap: 10px;
        padding: 11px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-2);
        transition: background 0.15s;
        text-align: left;
      }
      .notif-item:hover {
        background: var(--surface-2);
      }
      .notif-item:last-child {
        border-bottom: 0;
      }
      .notif-ico {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        flex-shrink: 0;
        background: rgba(245, 166, 35, 0.15);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
      }
      .notif-it-main {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }
      .notif-it-title {
        font-size: 0.84rem;
        font-weight: 600;
        color: var(--text);
      }
      .notif-it-sub {
        font-size: 0.74rem;
        color: var(--text-3);
        line-height: 1.35;
      }
      .notif-it-meta {
        font-size: 0.68rem;
        color: var(--text-muted);
      }
      .notif-foot {
        padding: 10px 14px;
        border-top: 1px solid var(--border);
        text-align: center;
      }
      .notif-foot button {
        background: transparent;
        border: 0;
        color: var(--primary);
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
        font-family: inherit;
      }
      /* — Menu user gabungan (avatar + pengaturan + logout) — */
      .topbar-usermenu {
        position: relative;
        flex-shrink: 0;
      }
      .topbar-user-trigger {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--topbar-card-inner);
        border: 1.5px solid var(--topbar-card-border);
        border-radius: 11px;
        padding: 5px 9px 5px 6px;
        cursor: pointer;
        font-family: inherit;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .topbar-user-trigger::before {
        display: none;
      }
      .topbar-user-trigger::after {
        display: none;
      }
      .topbar-user-trigger:hover {
        background: var(--topbar-card-inner-hover);
        border-color: var(--topbar-card-border);
      }
      .topbar-user-caret {
        color: var(--topbar-card-caret);
        font-size: 0.7rem;
        transition: transform 0.2s;
      }
      .topbar-usermenu.open .topbar-user-caret {
        transform: rotate(180deg);
      }
      .usermenu-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 240px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        padding: 8px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          visibility 0.18s;
        z-index: 200;
      }
      .topbar-usermenu.open .usermenu-dropdown {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .usermenu-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 10px 12px;
      }
      .usermenu-avatar-lg {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: var(--on-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
        flex-shrink: 0;
      }
      .usermenu-head-info {
        display: flex;
        flex-direction: column;
        line-height: 1.3;
        min-width: 0;
      }
      .usermenu-name {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--text);
      }
      .usermenu-role {
        font-size: 0.76rem;
        color: var(--text-3);
      }
      .usermenu-email {
        font-size: 0.72rem;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .usermenu-divider {
        height: 1px;
        background: var(--border);
        margin: 4px 0 6px;
      }
      .usermenu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text-2);
        font-size: 0.86rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .usermenu-item i {
        width: 18px;
        text-align: center;
        font-size: 0.9rem;
      }
      .usermenu-item:hover {
        background: var(--surface-3);
        color: var(--primary);
      }
      .usermenu-item-danger {
        color: var(--danger);
      }
      .usermenu-item-danger:hover {
        background: rgba(220, 38, 38, 0.12);
        color: var(--danger);
      }
      #bodyWrap {
        display: flex;
        flex: 1;
        min-height: calc(100vh - 56px);
      }

      #sidebar {
        width: 220px;
        min-width: 220px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 12px 10px;
        display: none;
        flex-direction: column;
        gap: 2px;
        overflow: hidden; /* ← pindahkan ke sini */
        transition:
          width 0.25s ease,
          opacity 0.25s ease,
          min-width 0.25s ease;
      }
      #sidebarNav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
      }
      #contentWrap {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        min-width: 0;
      }
      #pageContent {
        min-height: 200px;
      }

      /* ── Nav & Sidebar ── */
      .top-nav-btn {
        position: relative;
        z-index: 1;
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 14px;
        height: 100%;
        background: transparent;
        color: rgba(255, 255, 255, 0.82);
        border: none;
        border-radius: 999px;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
        transition:
          color 0.25s ease,
          transform 0.25s ease;
      }
      .top-nav-btn i {
        transition: transform 0.25s ease;
      }
      .top-nav-btn:hover {
        color: #fff;
      }
      .top-nav-btn.active {
        color: #1e3a8a;
        transform: translateY(-1px);
      }
      .top-nav-btn.active i {
        transform: scale(1.18);
      }
      [data-theme="dark"] .top-nav-btn.active {
        color: #06243a;
      }
      .sidebar-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;

    <script>
      /* ═══════════════════════════════════════════════
      Main — SiSi ULP Toboali
      Rev: 1 Jun 2026 (tema Light/Dark + toggle + notifikasi)
    ═══════════════════════════════════════════════ */

      /* ════════════════════
      TEMA (Light / Dark)
    ════════════════════ */
      var THEME_KEY = "sisiTheme";
      function _getThemeTersimpan() {
        try {
          return localStorage.getItem(THEME_KEY) || "light";
        } catch (e) {
          return "light";
        }
      }
      function _syncThemeIcon(mode) {
        var btn = document.getElementById("btnToggleTheme");
        if (!btn) return;
        var dark = mode === "dark";
        btn.innerHTML = dark
          ? '<i class="fa-solid fa-sun"></i>'
          : '<i class="fa-solid fa-moon"></i>';
        btn.title = dark ? "Mode terang" : "Mode gelap";
      }
      function applyTheme(mode) {
        var m = mode === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", m);
        try {
          localStorage.setItem(THEME_KEY, m);

            case 4: return fn.call(runner, finalArgs[0], finalArgs[1], finalArgs[2], finalArgs[3]);

      function onNavClick(navKey) {
        if (_state.activeNav === navKey) {
          _state.activeNav = "";
          _hideSidebar();
          _clearActiveNav();
          _tampilWelcome();
          _syncToggleBtn();
          return;

          return;
        }
        _state.activeNav = navKey;
        _setActiveNav(navKey);

      function _moveNavIndicator() {
        var nav = document.getElementById("topbarNav");
        var ind = document.getElementById("navIndicator");
        if (!nav || !ind) return;
        var act = nav.querySelector(".top-nav-btn.active");
        if (!act) {
          ind.style.opacity = "0";
          ind.style.width = "0";
          return;
        }
        ind.style.opacity = "1";
        ind.style.width = act.offsetWidth + "px";
        ind.style.transform = "translateX(" + act.offsetLeft + "px)";
      }
      window.addEventListener("resize", _moveNavIndicator);

      function _setActiveNav(navKey) {
        document.querySelectorAll(".top-nav-btn").forEach(function (b) {
          b.classList.toggle("active", b.dataset.nav === navKey);
        });
        _moveNavIndicator();
      }

      function _clearActiveNav() {
        document.querySelectorAll(".top-nav-btn").forEach(function (b) {
          b.classList.remove("active");
        });

      /* ════════════════════
      SIDEBAR

      function _buildSidebar(navKey) {
        var sidebar = _el("sidebarNav");
        if (!sidebar) return;
        var pages = NAV_SIDEBARS[navKey] || [];
        var html = "";
        pages.forEach(function (page) {
          if (!_isMenuItemAllowed(page)) return; /* filter sesuai akses akun */
          var icon = NAV_ICONS[page] || "fa-circle";
          var label = NAV_LABELS[page] || page;
          var sub = SUBMENUS[page];
          if (sub) {
            html +=
              '<div class="sidebar-item has-sub" data-page="' +
              page +
              '" ' +
              "onclick=\"_toggleSubmenu('sub-" +
              page +
              "',this)\">" +
              '<i class="fa-solid ' +
              icon +
              '"></i><span>' +
              _escHtml(label) +
              "</span>" +
              '<i class="fa-solid fa-chevron-right sidebar-arrow" id="arr-' +
              page +
              '"' +
              ' style="margin-left:auto;font-size:.68rem"></i></div>' +
              '<div id="sub-' +
              page +
              '" style="display:none">';
            sub.forEach(function (child) {
              if (!_isPageAllowed(child)) return; /* filter submenu */
              var ci = NAV_ICONS[child] || "fa-circle-dot";
              var cl = NAV_LABELS[child] || child;
              html +=
                '<div class="sidebar-item sidebar-sub" data-page="' +
                child +
                '" ' +
                "onclick=\"_loadPage('" +

                "')\">" +

                ci +

                _escHtml(cl) +
                "</span></div>";
            });
            html += "</div>";

              page +
              '" ' +
              "onclick=\"_loadPage('" +
              page +

              '<i class="fa-solid ' +
              icon +
              '"></i><span>' +

      function _toggleSubmenu(subId, parentEl) {
        var sub = _el(subId);

        sub.style.display = isOpen ? "none" : "block";

      /* ════════════════════
      LOAD PAGE
    ════════════════════ */
      function _loadPage(pageName) {
        if (!pageName) return;
        _state.activePage = pageName;
        _setActiveSidebar(pageName);

        var konten = _el("pageContent");
        if (!konten) return;

        konten.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;' +
          'height:40vh;flex-direction:column;gap:16px;color:#64748b">' +
          '<i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#1e3a8a"></i>' +
          '<span style="font-size:.88rem">Memuat ' +
          _escHtml(NAV_LABELS[pageName] || pageName) +
          "…</span></div>";

        var token = _state.token || _getToken();

        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || !res.success) {
              if (res && res.redirect === "login") {
                sessionStorage.removeItem("sisiSesi");
                _tampilLogin();
                return;
              }
              konten.innerHTML =
                '<div style="padding:40px;text-align:center;color:#dc2626">' +
                '<i class="fa-solid fa-circle-exclamation fa-2x"' +
                ' style="display:block;margin-bottom:12px"></i>' +
                _escHtml((res && res.message) || "Gagal memuat halaman") +
                "</div>";
              return;
            }

            /* Inject HTML */
            konten.innerHTML = res.html;

            /* ✅ Sesi global untuk halaman anak (mis. Temuan-Inspeksi) */
            window.__SISI_SESI__ = res.sesi || _state.sesi;
            window.__SISI_PAGE__ = pageName;

            /* ✅ Eksekusi ulang <script> — innerHTML tidak auto-run script */
            var scripts = konten.querySelectorAll("script");
            for (var i = 0; i < scripts.length; i++) {
              var lama = scripts[i];
              var baru = document.createElement("script");
              for (var j = 0; j < lama.attributes.length; j++) {
                baru.setAttribute(
                  lama.attributes[j].name,
                  lama.attributes[j].value,
                );
              }
              baru.textContent = lama.textContent;
              lama.parentNode.replaceChild(baru, lama);
            }

            /* Panggil init function halaman jika ada */
            var fn = INIT_FNS[pageName];
            if (fn && typeof window[fn] === "function") {
              try {
                window[fn]();
              } catch (e) {
                console.warn("[loadPage] initFn error:", e);
              }
            }
          })
          .withFailureHandler(function (err) {
            konten.innerHTML =
              '<div style="padding:40px;text-align:center;color:#dc2626">' +
              '<i class="fa-solid fa-circle-exclamation fa-2x"' +
              ' style="display:block;margin-bottom:12px"></i>' +
              "Error: " +
              _escHtml((err && err.message) || String(err)) +
              "</div>";
          })
          .getPageContent(token, pageName);
      }

      function loadPage(p) {
        _loadPage(p);
      }

       items[] berisi string (key halaman) atau objek sub-grup { sub, label, ikon, keys[] }. */
      var AKSES_BIDANG_GRUP = [
        {
          nama: "PP",
          label: "PP — Perencanaan",
          ikon: "fa-chart-pie",

      function _aksesLeafBox(nama, sub, key, label, checked) {
        var on = checked.indexOf(key) >= 0 ? "checked" : "";
        var subAttr = sub ? ' data-sub="' + sub + '"' : "";
        return (
          '<label class="akses-chk akses-chk-sub">' +
          '<input type="checkbox" class="akMenuSub" data-grup="' +
          nama +
          '"' +
          subAttr +
          ' value="' +
          key +
          '" ' +
          on +
          " onchange=\"_aksesSyncGrup('" +
          nama +
          "')\">" +
          "<span>" +
          _escHtml(label) +
          "</span></label>"
        );
      }

      function _buildAksesMenuGroups(checked) {
        var opts = _aksesMenuOptions || [];
        var labelByKey = {};
        opts.forEach(function (m) {
          labelByKey[m.key] = m.label;
        });
        var assigned = {};
        function adaKey(k) {
          return labelByKey.hasOwnProperty(k);
        }

        var html = AKSES_BIDANG_GRUP.map(function (g) {
          var bodyHtml = "";
          var adaAnak = false;
          (g.items || []).forEach(function (it) {
            if (typeof it === "string") {
              if (!adaKey(it)) return;
              assigned[it] = true;
              adaAnak = true;
              bodyHtml += _aksesLeafBox(
                g.nama,
                "",
                it,
                labelByKey[it],
                checked,
              );
            } else {
              var anak = (it.keys || []).filter(adaKey);
              if (!anak.length) return;
              anak.forEach(function (k) {
                assigned[k] = true;
              });
              adaAnak = true;
              var subLeaves = anak
                .map(function (k) {
                  return _aksesLeafBox(
                    g.nama,
                    it.sub,
                    k,
                    labelByKey[k],
                    checked,
                  );
                })
                .join("");
              bodyHtml +=
                '<div class="akses-subgrup" data-grup="' +
                g.nama +
                '" data-sub="' +
                it.sub +
                '">' +
                '<label class="akses-subgrup-head">' +
                '<input type="checkbox" class="akMenuSubGrup" data-grup="' +
                g.nama +
                '" data-sub="' +
                it.sub +
                '"' +
                " onchange=\"_aksesToggleSub('" +
                g.nama +
                "','" +
                it.sub +
                "',this.checked)\">" +
                '<i class="fa-solid ' +
                (it.ikon || "fa-folder") +
                '"></i><span>' +
                _escHtml(it.label || it.sub) +
                "</span></label>" +
                '<div class="akses-subgrup-body">' +
                subLeaves +
                "</div></div>";
            }
          });
          if (!adaAnak) return "";
          return (
            '<div class="akses-grup" data-grup="' +
            g.nama +
            '">' +
            '<label class="akses-grup-head">' +
            '<input type="checkbox" class="akMenuGrup" data-grup="' +
            g.nama +
            '"' +
            " onchange=\"_aksesToggleGrup('" +
            g.nama +
            "',this.checked)\">" +
            '<i class="fa-solid ' +
            g.ikon +
            '"></i><span>' +
            _escHtml(g.label) +
            "</span></label>" +
            '<div class="akses-grup-body">' +
            bodyHtml +
            "</div></div>"
          );
        }).join("");

        /* Menu yang belum terpetakan ke bidang manapun */
        var sisa = opts.filter(function (m) {
          return !assigned[m.key];
        });
        if (sisa.length) {
          var sisaHtml = sisa
            .map(function (m) {
              return _aksesLeafBox("Lainnya", "", m.key, m.label, checked);
            })
            .join("");
          html +=
            '<div class="akses-grup" data-grup="Lainnya">' +
            '<label class="akses-grup-head">' +
            '<input type="checkbox" class="akMenuGrup" data-grup="Lainnya"' +
            " onchange=\"_aksesToggleGrup('Lainnya',this.checked)\">" +
            '<i class="fa-solid fa-ellipsis"></i><span>Lainnya</span></label>' +
            '<div class="akses-grup-body">' +
            sisaHtml +
            "</div></div>";
        }
        return html;
      }

      function _aksesToggleGrup(nama, on) {
        document
          .querySelectorAll('#aksesBody .akMenuSub[data-grup="' + nama + '"]')
          .forEach(function (c) {
            c.checked = on;
          });
        _aksesSyncGrup(nama);
      }

      function _aksesToggleSub(nama, sub, on) {
        document
          .querySelectorAll(
            '#aksesBody .akMenuSub[data-grup="' +
              nama +
              '"][data-sub="' +
              sub +
              '"]',
          )
          .forEach(function (c) {
            c.checked = on;
          });
        _aksesSyncGrup(nama);
      }

      function _aksesSyncSub(nama, sub) {
        if (!sub) return;
        var subs = Array.prototype.slice.call(
          document.querySelectorAll(
            '#aksesBody .akMenuSub[data-grup="' +
              nama +
              '"][data-sub="' +
              sub +
              '"]',
          ),
        );
        var box = document.querySelector(
          '#aksesBody .akMenuSubGrup[data-grup="' +
            nama +
            '"][data-sub="' +
            sub +
            '"]',
        );
        if (!box) return;
        var total = subs.length;
        var dipilih = subs.filter(function (c) {
          return c.checked;
        }).length;
        box.checked = dipilih > 0 && dipilih === total;
        box.indeterminate = dipilih > 0 && dipilih < total;
      }

      function _aksesSyncGrup(nama) {
        /* sinkronkan dulu sub-grup di bidang ini */
        document
          .querySelectorAll(
            '#aksesBody .akMenuSubGrup[data-grup="' + nama + '"]',
          )
          .forEach(function (sg) {
            _aksesSyncSub(nama, sg.getAttribute("data-sub"));
          });
        var subs = Array.prototype.slice.call(
          document.querySelectorAll(
            '#aksesBody .akMenuSub[data-grup="' + nama + '"]',
          ),
        );
        var grup = document.querySelector(
          '#aksesBody .akMenuGrup[data-grup="' + nama + '"]',
        );
        if (!grup) return;
        var total = subs.length;
        var dipilih = subs.filter(function (c) {
          return c.checked;
        }).length;
        grup.checked = dipilih > 0 && dipilih === total;
        grup.indeterminate = dipilih > 0 && dipilih < total;
      }

      function _aksesSyncSemuaGrup() {
        AKSES_BIDANG_GRUP.forEach(function (g) {
          _aksesSyncGrup(g.nama);
        });
        _aksesSyncGrup("Lainnya");
      }

      function _aksesFormBaru() {
        _renderAksesForm(null);
      }
      function _aksesFormEdit(username) {
        var a = (_aksesAkunCache || []).find(function (x) {
          return x.username === username;
        });
        _renderAksesForm(a || { username: username });
      }

      function _renderAksesForm(akun) {
        var isEdit = !!akun;
        akun = akun || {};
        var checked = akun.aksesMenu || [];
        var menuBoxes = _buildAksesMenuGroups(checked);
        var pwLabel = isEdit ? "Password (kosongkan jika tetap)" : "Password *";
        var html =
          '<div class="akses-list-head"><span class="akses-list-title">' +
          (isEdit
            ? "Edit Akun: " + _escHtml(akun.username)
            : "Tambah Akun Baru") +
          "</span></div>" +
          '<div class="akses-form-grid">' +
          '<div><label>Username *</label><input id="afUsername" value="' +
          _escHtml(akun.username || "") +
          '"></div>' +
          '<div><label>Email</label><input id="afEmail" value="' +
          _escHtml(akun.email || "") +
          '"></div>' +
          "<div><label>" +
          pwLabel +
          '</label><input id="afPassword" type="text" placeholder="' +
          (isEdit ? "••••••" : "Password") +
          '"></div>' +
          '<div><label>Role</label><input id="afRole" value="' +
          _escHtml(akun.role || "") +
          '" placeholder="Super User / Team Leader / Staff / ..."></div>' +
          '<div><label>Bidang</label><input id="afBidang" value="' +
          _escHtml(akun.bidang || "") +
          '" placeholder="Teknik / PP / TE / K3"></div>' +
          '<div><label>Tim</label><input id="afTim" value="' +
          _escHtml(akun.tim || "") +
          '" placeholder="Inspeksi Jaringan / ROW / ..."></div>' +
          '<div><label>Sub - Tim</label><input id="afSubTim" value="' +
          _escHtml(akun.subTim || "") +
          '" placeholder="mis. Inspeksi Gardu / ROW 01"></div>' +
          '<div><label>ULP</label><input id="afUlp" value="' +
          _escHtml(akun.ulp || "") +
          '"></div>' +
          '<div><label>Kode ULP</label><input id="afKodeUlp" value="' +
          _escHtml(akun.kodeUlp || "") +
          '"></div>' +
          "</div>" +
          '<div class="akses-menu-wrap">' +
          '<label class="akses-menu-title">Menu yang dapat diakses</label>' +
          '<p class="akses-menu-note">Super User otomatis melihat semua menu. Centang bidang untuk memilih semua sub-menunya sekaligus, atau centang sub-menu tertentu saja.</p>' +
          '<div class="akses-menu-groups">' +
          menuBoxes +
          "</div></div>" +
          '<input type="hidden" id="afTarget" value="' +
          _escHtml(akun.username || "") +
          '">' +
          '<div class="akses-form-foot">' +
          '<button class="akses-btn-sec" onclick="_aksesLoadList()">Batal</button>' +
          '<button class="akses-btn-pri" id="afBtnSimpan" onclick="_aksesSimpan()"><i class="fa-solid fa-floppy-disk"></i> Simpan Akun</button>' +
          "</div>";
        _el("aksesBody").innerHTML = html;
        _aksesSyncSemuaGrup();
      }

      function _aksesSimpan() {
        var btn = _el("afBtnSimpan");
        var isEdit = !!_el("afTarget").value.trim();
        var data = {
          username: _el("afUsername").value.trim(),
          email: _el("afEmail").value.trim(),
          password: _el("afPassword").value.trim(),
          role: _el("afRole").value.trim(),
          bidang: _el("afBidang").value.trim(),
          tim: _el("afTim").value.trim(),
          subTim: _el("afSubTim").value.trim(),
          ulp: _el("afUlp").value.trim(),
          kodeUlp: _el("afKodeUlp").value.trim(),
          aksesMenu: Array.prototype.slice
            .call(document.querySelectorAll("#aksesBody .akMenuSub:checked"))
            .map(function (c) {
              return c.value;
            }),
        };
        if (!data.username) {
          alert("Username wajib diisi");
          return;
        }
        if (!isEdit && !data.password) {
          alert("Password wajib diisi untuk akun baru");
          return;
        }
        if (btn) {
          btn.disabled = true;
          btn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan…';
        }
        var token = _state.token || _getToken();
        var handler = function (res) {
          if (btn) btn.disabled = false;
          if (res && res.ok) {
            showToast("Akun tersimpan", "success");
            _aksesLoadList();
          } else {
            alert((res && res.message) || "Gagal menyimpan akun");
          }
        };
        var fail = function (e) {
          if (btn) btn.disabled = false;
          alert("Error: " + ((e && e.message) || e));
        };
        if (isEdit) {
          data.targetUsername = _el("afTarget").value.trim();
          SisiRun
            .withSuccessHandler(handler)
            .withFailureHandler(fail)
            .updateAkun(token, data);
        } else {
          SisiRun
            .withSuccessHandler(handler)
            .withFailureHandler(fail)
            .tambahAkun(token, data);
        }
      }

      function _aksesHapus(username) {
        if (!confirm('Hapus akun "' + username + '"? Tindakan ini permanen.'))
          return;
        var token = _state.token || _getToken();
        SisiRun
          .withSuccessHandler(function (res) {
            if (res && res.ok) {
              showToast("Akun dihapus", "success");
              _aksesLoadList();
            } else {
              alert((res && res.message) || "Gagal menghapus");
            }
          })
          .withFailureHandler(function (e) {
            alert("Error: " + ((e && e.message) || e));
          })
          .hapusAkun(token, username);
      }

      function _aksesResetPw(username) {
        var pw = prompt('Masukkan password baru untuk "' + username + '":');
        if (!pw) return;
        var token = _state.token || _getToken();
        SisiRun
          .withSuccessHandler(function (res) {
            if (res && res.ok) {
              showToast("Password berhasil direset", "success");
            } else {
              alert((res && res.message) || "Gagal reset password");
            }
          })
          .withFailureHandler(function (e) {
            alert("Error: " + ((e && e.message) || e));
          })
          .resetPasswordAkun(token, username, pw);
      }

      /* ════════════════════
      GANTI PASSWORD
    ════════════════════ */
      function bukaGantiPassword() {
        var pwLama = prompt("Masukkan password lama:");
        if (!pwLama) return;
        var pwBaru = prompt("Masukkan password baru:");
        if (!pwBaru) return;
        if (pwBaru.length < 6) {
          alert("Password baru minimal 6 karakter");
          return;
        }
        var token = _state.token || _getToken();
        SisiRun
          .withSuccessHandler(function (res) {
            if (res && res.ok) {
              showToast(
                res.message || "Password berhasil diganti.",
                "success",
              );
            } else {
              alert((res && res.message) || "Gagal mengganti password");
            }
          })
          .withFailureHandler(function (err) {
            alert("Error: " + ((err && err.message) || err));
          })
          .gantiPassword(token, pwLama, pwBaru);
      }

      /* ════════════════════
      LOGOUT
    ════════════════════ */
      function doLogout() {
        var token = _state.token || _getToken();
        var scriptUrl = window.location.href.split("?")[0];
        try {
          sessionStorage.removeItem("sisiSesi");
        } catch (e) {}
        _state.token = "";
        _state.sesi = {};
        try {
          SisiRun.doLogout(token);
        } catch (e) {}
        setTimeout(function () {
          _selesaiLogout(scriptUrl);
        }, 150);
      }

      function _selesaiLogout(url) {
        try {
          if (window.top && window.top !== window) {
            window.top.location.href = url;
            return;
          }
        } catch (e) {}
        try {
          window.location.replace(url);
        } catch (e2) {
          window.location.href = url;
        }
      }

      /* ════════════════════
      TOAST
    ════════════════════ */
      function showToast(msg, type) {
        var t = document.createElement("div");
        var bg =
          type === "success"
            ? "var(--success)"
            : type === "warning"
              ? "var(--warning)"
              : "var(--danger)";
        t.style.cssText =
          "position:fixed;bottom:24px;right:24px;background:" +
          bg +
          ";color:#fff;padding:12px 20px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:99999;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px";
        var icon =
          type === "success"
            ? "fa-circle-check"
            : type === "warning"
              ? "fa-triangle-exclamation"
              : "fa-circle-xmark";
        t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + _escHtml(msg);
        document.body.appendChild(t);
        setTimeout(function () {
          t.style.transition = "opacity .3s ease";
          t.style.opacity = "0";
          setTimeout(function () {
            if (t.parentNode) t.parentNode.removeChild(t);
          }, 320);
        }, 3000);
      }

      document.addEventListener("DOMContentLoaded", function () {
        var btn = _el("btnToggleSidebar");
        if (btn) {
          btn.addEventListener("click", function () {
            var sb = _el("sidebar");
            if (!sb || _state.activeNav === "") return;
            _sidebarToggleHidden = !_sidebarToggleHidden;
            sb.classList.toggle("sidebar-hidden", _sidebarToggleHidden);
          });
        }
        initMain();
      });
    </script>
  </body>
</html>
