<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadwal Padam</title><style>body{font:14px Arial,sans-serif;margin:0;background:#f4f7fb;color:#1e293b}.wrap{padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.head h2{margin:0;color:#1e3a8a}.btn{background:#1e3a8a;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.filter,.table{background:white;border:1px solid #dbe3ef;border-radius:12px;padding:16px;margin-top:16px}.filter{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase}.field input,.field select{height:36px;border:1px solid #cbd5e1;border-radius:7px;padding:0 9px}.table{overflow:auto}table{border-collapse:collapse;min-width:1350px;width:100%}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}th{background:#eef3f9;color:#64748b;font-size:11px;text-transform:uppercase}.auto{background:#eef0f3!important;color:#68717c!important;cursor:not-allowed}.modal{display:none;position:fixed;inset:0;background:#0f172a99;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:white;width:min(780px,100%);max-height:90vh;overflow:auto;border-radius:14px}.dialog h3{margin:0;padding:18px;border-bottom:1px solid #e2e8f0}.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid #e2e8f0}@media(max-width:700px){.wrap{padding:14px}.form{grid-template-columns:1fr}.form .full{grid-column:auto}.head{display:block}.head .btn{margin-top:12px}}</style></head><body><main class="wrap"><div class="head"><div><h2>Rincian Jadwal Padam</h2><p>Data jadwal padam dan dampak pelanggan.</p></div><button class="btn" onclick="show('jpModal')">Input Jadwal Padam</button></div><section class="filter"><div class="field"><label>Tanggal Mulai</label><input type="date" id="jpFrom"></div><div class="field"><label>Tanggal Selesai</label><input type="date" id="jpTo"></div><div class="field" id="jpUlpWrap"><label>ULP</label><select id="jpUlp"><option value="">Semua ULP</option></select></div><div class="field"><label>Penyulang</label><select id="jpPeny" onchange="jpFilterSections()"><option value="">Semua Penyulang</option></select></div><div class="field"><label>Section</label><select id="jpSection"><option value="">Semua Section</option></select></div><button class="btn" onclick="loadList()">Cari</button></section><section class="table"><table><thead><tr><th>No</th><th>Kode Jadwal Padam</th><th>ULP</th><th>UP3</th><th>GI</th><th>Penyulang</th><th>Section</th><th>Jenis Pekerjaan</th><th>Tanggal</th><th>Jam Padam</th><th>Jam Nyala</th><th>Durasi</th><th>Beban MW</th><th>Arus (A)</th><th>Jumlah Gardu</th><th>Jumlah Pelanggan</th><th>Daerah Section</th><th>Pelanggan VIP</th></tr></thead><tbody id="jpBody"><tr><td colspan="18">Pilih filter lalu klik Cari.</td></tr></tbody></table></section></main><div class="modal" id="jpModal"><div class="dialog"><h3>Input Jadwal Padam</h3><form class="form" onsubmit="return saveJadwal(event)"><div class="field"><label>Penyulang</label><select id="mPeny" required onchange="loadSections()"><option value="">Pilih Penyulang</option></select></div><div class="field"><label>Section</label><select id="mSection" required onchange="loadAuto()"><option value="">Pilih Penyulang dulu</option></select></div><div class="field"><label>Jenis Pekerjaan</label><input id="mJenis" required></div><div class="field"><label>Tanggal</label><input id="mTanggal" type="date" required></div><div class="field"><label>Jam Padam</label><input id="mPadam" type="time" step="60" required onclick="this.showPicker&&this.showPicker()"></div><div class="field"><label>Jam Nyala</label><input id="mNyala" type="time" step="60" required onclick="this.showPicker&&this.showPicker()"></div><div class="field"><label>Beban MW</label><input id="mBeban" class="auto" readonly placeholder="Otomatis dari Master Daerah Padam"></div><div class="field"><label>Arus (A)</label><input id="mArus" class="auto" readonly></div><div class="field"><label>Jumlah Gardu</label><input id="mGardu" class="auto" readonly></div><div class="field"><label>Jumlah Pelanggan</label><input id="mPelanggan" class="auto" readonly></div><div class="field"><label>Daerah Section</label><input id="mDaerah" class="auto" readonly></div><div class="field"><label>Pelanggan VIP</label><input id="mVip" class="auto" readonly></div><div class="field full"><label>Lokasi Pekerjaan</label><input id="mLokasi"></div></form><div class="foot"><button class="btn" style="background:#64748b" onclick="hide('jpModal')">Batal</button><button class="btn" onclick="document.querySelector('form').requestSubmit()">Simpan</button></div></div></div><script>
var jpMaster = {};
var jpRows = [];
function show(id){document.getElementById(id).classList.add('show');jpLoadMaster();}
function hide(id){document.getElementById(id).classList.remove('show');}
function jpOption(value,label){var o=document.createElement('option');o.value=value;o.textContent=label||value;return o;}
function jpLoadMaster(){if(window.google&&google.script)google.script.run.withSuccessHandler(jpPopulate).withFailureHandler(function(e){console.error('Master Jadwal Padam gagal dimuat',e);}).getJadwalPadamMaster({});}
function jpPopulate(res){
  jpMaster={};jpRows=(res&&res.rows)||[];
  var modalPeny=document.getElementById('mPeny'),filterPeny=document.getElementById('jpPeny'),ulp=document.getElementById('jpUlp');
  modalPeny.innerHTML='<option value="">Pilih Penyulang</option>';filterPeny.innerHTML='<option value="">Semua Penyulang</option>';ulp.innerHTML='<option value="">Semua ULP</option>';
  var feeders={},ulps={};
  jpRows.forEach(function(x){var nama=String(x.penyulang||'').trim(),k=nama.toLowerCase();if(!nama)return;if(!jpMaster[k])jpMaster[k]=[];jpMaster[k].push(x);feeders[k]=nama;if(x.ulp)ulps[String(x.ulp).toLowerCase()]=x.ulp;});
  Object.keys(feeders).sort(function(a,b){return feeders[a].localeCompare(feeders[b]);}).forEach(function(k){modalPeny.appendChild(jpOption(feeders[k]));filterPeny.appendChild(jpOption(feeders[k]));});
  Object.keys(ulps).sort().forEach(function(k){ulp.appendChild(jpOption(ulps[k]));});
  jpFilterSections();
}
function loadSections(){
  var key=document.getElementById('mPeny').value.toLowerCase(),s=document.getElementById('mSection');s.innerHTML='<option value="">Pilih Section</option>';
  var seen={};(jpMaster[key]||[]).forEach(function(x){var v=String(x.section||'').trim(),k=v.toLowerCase();if(v&&!seen[k]){seen[k]=true;s.appendChild(jpOption(v));}});
  ['mBeban','mArus','mGardu','mPelanggan','mDaerah','mVip'].forEach(function(id){document.getElementById(id).value='';});
}
function jpFilterSections(){
  var key=document.getElementById('jpPeny').value.toLowerCase(),s=document.getElementById('jpSection');s.innerHTML='<option value="">Semua Section</option>';var seen={};
  var source=key?(jpMaster[key]||[]):jpRows;source.forEach(function(x){var v=String(x.section||'').trim(),k=v.toLowerCase();if(v&&!seen[k]){seen[k]=true;s.appendChild(jpOption(v));}});
}
function loadAuto(){
  var key=document.getElementById('mPeny').value.toLowerCase(),sec=document.getElementById('mSection').value.toLowerCase(),x=(jpMaster[key]||[]).find(function(r){return String(r.section||'').toLowerCase()===sec;});if(!x)return;
  document.getElementById('mBeban').value=x.bebanMw==null?'':x.bebanMw;document.getElementById('mArus').value=x.arus==null?'':x.arus;
  document.getElementById('mGardu').value=x.jumlahGardu==null?'':x.jumlahGardu;document.getElementById('mPelanggan').value=x.jumlahPelanggan==null?'':x.jumlahPelanggan;document.getElementById('mDaerah').value=x.daerahSection||'';document.getElementById('mVip').value=x.pelangganVip||'';
}
function loadList(){
  if(window.google&&google.script)google.script.run.withSuccessHandler(function(r){var b=document.getElementById('jpBody');b.innerHTML=(r.rows||[]).map(function(x){return '<tr><td>'+x.no+'</td><td>'+x.kode+'</td><td>'+x.ulp+'</td><td>'+x.up3+'</td><td>'+x.gi+'</td><td>'+x.penyulang+'</td><td>'+x.section+'</td><td>'+x.jenis+'</td><td>'+x.tanggal+'</td><td>'+x.jamPadam+'</td><td>'+x.jamNyala+'</td><td>'+x.durasi+'</td><td>'+x.bebanMw+'</td><td>'+x.arus+'</td><td>'+x.jumlahGardu+'</td><td>'+x.jumlahPelanggan+'</td><td>'+x.daerah+'</td><td>'+x.vip+'</td></tr>';}).join('')||'<tr><td colspan="18">Tidak ada data.</td></tr>';}).getJadwalPadamList({ulp:document.getElementById('jpUlp').value,penyulang:document.getElementById('jpPeny').value,section:document.getElementById('jpSection').value,tglDari:document.getElementById('jpFrom').value,tglSampai:document.getElementById('jpTo').value});
}
function saveJadwal(e){e.preventDefault();hide('jpModal');return false;}
jpLoadMaster();
</script></body></html>
