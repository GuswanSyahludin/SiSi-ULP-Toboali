name: Patch Jadwal Native Time Picker
on:
  push:
    branches: [fix/jadwal-padam-native-time-picker]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-native-time-picker
      - run: python .github/scripts/patch_jadwal_native_time.py
      - run: |
          grep -q 'id="mPadam" type="time"' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'id="mNyala" type="time"' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          ! grep -q 'jpPopulateTimeOptions' SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): use native clock picker for outage times [skip ci]" || exit 0
          git push origin fix/jadwal-padam-native-time-picker
