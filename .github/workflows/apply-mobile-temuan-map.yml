name: Apply Mobile Temuan Map
on:
  push:
    branches: [feat/mobile-temuan-map]
    paths:
      - '.github/scripts/apply_mobile_temuan_map.py'
      - '.github/workflows/apply-mobile-temuan-map.yml'
permissions:
  contents: write
jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-temuan-map
      - run: python .github/scripts/apply_mobile_temuan_map.py
      - name: Validate wiring
        run: |
          grep -q "import 'peta_temuan_screen.dart';" SiSi_Mobile/lib/screens/dashboard_screen.dart
          grep -q "'title': 'Peta Temuan'" SiSi_Mobile/lib/screens/dashboard_screen.dart
          grep -q 'PetaTemuanScreen' SiSi_Mobile/lib/screens/dashboard_screen.dart
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart
          git commit -m "feat(mobile): wire Peta Temuan into Teknik menu"
          git push origin HEAD:feat/mobile-temuan-map
