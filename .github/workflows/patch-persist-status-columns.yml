name: Persist Jadwal Status Columns
on:
  push:
    branches: [fix/jadwal-padam-persist-status-columns-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-persist-status-columns-v2
      - run: python .github/scripts/patch_persist_status_columns.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "fix(web): persist Jadwal status columns [skip ci]" || exit 0
          git push origin fix/jadwal-padam-persist-status-columns-v2
