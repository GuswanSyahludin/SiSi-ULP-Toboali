      - name: Commit source fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-verified-release-blockers.yml
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart \
