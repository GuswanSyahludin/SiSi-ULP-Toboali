name: Apply release blocker fixes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-verified-release-blockers.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          dashboard = Path('SiSi_Mobile/lib/screens/dashboard_screen.dart')
          text = dashboard.read_text()
          text, n = re.subn(r"  final List<String> menuItems = .*?\n  \];\n\n", '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('legacy menu fields not found')
          fixed = "  List<String> get currentMenuItems => const [\n        'Tim',\n        'Pengukuran',\n        'Beranda',\n        'Teknik',\n        'Pengaturan',\n      ];\n\n  List<IconData> get currentMenuIcons => const [\n        Icons.people_outline_rounded,\n        Icons.electrical_services_outlined,\n        Icons.home_rounded,\n        Icons.handyman_outlined,\n        Icons.settings_outlined,\n      ];\n\n"
          text, n = re.subn(r"  List<String> get currentMenuItems \{.*?(?=  void _selectMenu)", fixed, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dynamic menu getters not found')
          text = text.replace("case 'Gardu':", "case 'Pengukuran':", 1)
          text = text.replace('const bubbleSize = 56.0;', 'final isBeranda = selectedIndex == 2;\n                      final bubbleSize = isBeranda ? 64.0 : 52.0;\n                      final bubbleTop = isBeranda ? -22.0 : -14.0;', 1)
          text = text.replace('top: -17,', 'top: bubbleTop,', 1)
          text = text.replace('size: 37.4,', 'size: isBeranda ? 39.0 : 30.0,', 1)
          dashboard.write_text(text)

          api = 'SiSi_Mobile/lib/services/api_service.dart'
          replace_once(api, "  }) async {\n    final uri = Uri.parse(\n      '$baseUrl?mobile=1&action=getMobileApprovalP0List", "  }) async {\n    final sesi = await SesiStore.muat();\n    final token = (sesi?['token'] ?? '').toString();\n    final uri = Uri.parse(\n      '$baseUrl?mobile=1&action=getMobileApprovalP0List&token=${Uri.encodeComponent(token)}")
          replace_once(api, "  }) async {\n    // Rev 19 Agu malam: POST -> GET.", "  }) async {\n    final sesi = await SesiStore.muat();\n    final token = (sesi?['token'] ?? '').toString();\n    // Rev 19 Agu malam: POST -> GET.")
          replace_once(api, "      '$baseUrl?mobile=1&action=setMobileApprovalP0'\n      '&kodeP0=", "      '$baseUrl?mobile=1&action=setMobileApprovalP0'\n      '&token=${Uri.encodeComponent(token)}'\n      '&kodeP0=")
          replace_once(api, "      String kodeP0) async {\n    final uri = Uri.parse(\n      '$baseUrl?mobile=1&action=getMobileLampiranPengecekanP0&kodeP0=", "      String kodeP0) async {\n    final sesi = await SesiStore.muat();\n    final token = (sesi?['token'] ?? '').toString();\n    final uri = Uri.parse(\n      '$baseUrl?mobile=1&action=getMobileLampiranPengecekanP0&token=${Uri.encodeComponent(token)}&kodeP0=")

          code = 'SiSi_BackEnd/Core/Code.js'
          replace_once(code, '  if (typeof gangguanBerandaMobileRouter_ === "function") {', '  if (typeof jadwalPadamMobileRouter_ === "function") {\n    var lewatJadwalPadam = jadwalPadamMobileRouter_(e, body);\n    if (lewatJadwalPadam)\n      return ContentService.createTextOutput(JSON.stringify(lewatJadwalPadam))\n        .setMimeType(ContentService.MimeType.JSON);\n  }\n\n  if (typeof gangguanBerandaMobileRouter_ === "function") {')

          dual = Path('SiSi_BackEnd/Core/Tek-MobileDual.js')
          text = dual.read_text()
          old = '    /* PEMILIKAN: P0 harus milik ULP sesi (kecuali Super User). Tanpa ini\n'
          text = text.replace(old, '    var rp = rowsP[0];\n' + old, 1)
          first = text.index('    var rp = rowsP[0];')
          second = text.index('    var rp = rowsP[0];', first + 1)
          text = text[:second] + text[second + len('    var rp = rowsP[0];\n'):]
          dual.write_text(text)

          assert "'Pengukuran',\n        'Beranda'" in dashboard.read_text()
          assert Path(api).read_text().count('&token=${Uri.encodeComponent(token)}') >= 3
          assert 'jadwalPadamMobileRouter_(e, body)' in Path(code).read_text()
          final_dual = dual.read_text()
          assert final_dual.index('var rp = rowsP[0];') < final_dual.index('barisUlpCocok_(g, rp[COL_P0.ulp])')
          PY
          python3 /tmp/patch.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-verified-release-blockers.yml
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart SiSi_Mobile/lib/services/api_service.dart SiSi_BackEnd/Core/Code.js SiSi_BackEnd/Core/Tek-MobileDual.js
          git commit -m "fix: clear four verified mobile release blockers"
          git push origin HEAD:main
