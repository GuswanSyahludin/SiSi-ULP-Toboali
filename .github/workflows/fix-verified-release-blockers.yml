name: Apply release blocker fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-verified-release-blockers.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Patch source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          def one(path, old, new):
            p=Path(path); s=p.read_text()
            if s.count(old)!=1: raise SystemExit(f'{path}: match={s.count(old)}')
            p.write_text(s.replace(old,new,1))
          d='SiSi_Mobile/lib/screens/dashboard_screen.dart'
          p=Path(d); s=p.read_text()
          s,n=re.subn(r"  final List<String> menuItems = .*?\n  \];\n\n",'',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('legacy menu fields not found')
          fixed="""  List<String> get currentMenuItems => const [
        'Tim',
        'Pengukuran',
        'Beranda',
        'Teknik',
        'Pengaturan',
      ];

  List<IconData> get currentMenuIcons => const [
        Icons.people_outline_rounded,
        Icons.electrical_services_outlined,
        Icons.home_rounded,
        Icons.handyman_outlined,
        Icons.settings_outlined,
      ];

"""
          s,n=re.subn(r"  List<String> get currentMenuItems \{.*?(?=  void _selectMenu)",fixed,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dynamic menu getters not found')
          s=s.replace("case 'Gardu':","case 'Pengukuran':",1)
          s=s.replace("const bubbleSize = 56.0;","final isBeranda = selectedIndex == 2;\n                      final bubbleSize = isBeranda ? 64.0 : 52.0;\n                      final bubbleTop = isBeranda ? -22.0 : -14.0;",1)
          s=s.replace('top: -17,','top: bubbleTop,',1).replace('size: 37.4,','size: isBeranda ? 39.0 : 30.0,',1)
          p.write_text(s)

          a='SiSi_Mobile/lib/services/api_service.dart'
          one(a,"""  }) async {
    final uri = Uri.parse(
      '$baseUrl?mobile=1&action=getMobileApprovalP0List""","""  }) async {
    final sesi = await SesiStore.muat();
    final token = (sesi?['token'] ?? '').toString();
    final uri = Uri.parse(
      '$baseUrl?mobile=1&action=getMobileApprovalP0List&token=${Uri.encodeComponent(token)}""")
          one(a,"""  }) async {
    // Rev 19 Agu malam: POST -> GET.""","""  }) async {
    final sesi = await SesiStore.muat();
    final token = (sesi?['token'] ?? '').toString();
    // Rev 19 Agu malam: POST -> GET.""")
          one(a,"""      '$baseUrl?mobile=1&action=setMobileApprovalP0'
      '&kodeP0=""","""      '$baseUrl?mobile=1&action=setMobileApprovalP0'
      '&token=${Uri.encodeComponent(token)}'
      '&kodeP0=""")
          one(a,"""      String kodeP0) async {
    final uri = Uri.parse(
      '$baseUrl?mobile=1&action=getMobileLampiranPengecekanP0&kodeP0=""","""      String kodeP0) async {
    final sesi = await SesiStore.muat();
    final token = (sesi?['token'] ?? '').toString();
    final uri = Uri.parse(
      '$baseUrl?mobile=1&action=getMobileLampiranPengecekanP0&token=${Uri.encodeComponent(token)}&kodeP0=""")

          c='SiSi_BackEnd/Core/Code.js'
          one(c,'  if (typeof gangguanBerandaMobileRouter_ === "function") {',"""  if (typeof jadwalPadamMobileRouter_ === "function") {
    var lewatJadwalPadam = jadwalPadamMobileRouter_(e, body);
    if (lewatJadwalPadam)
      return ContentService.createTextOutput(JSON.stringify(lewatJadwalPadam))
        .setMimeType(ContentService.MimeType.JSON);
  }

  if (typeof gangguanBerandaMobileRouter_ === "function") {""")
          t='SiSi_BackEnd/Core/Tek-MobileDual.js'
          p=Path(t); s=p.read_text(); marker='    /* PEMILIKAN: P0 harus milik ULP sesi'
          if s.count(marker)!=1: raise SystemExit('ownership marker missing')
          s=s.replace(marker,'    var rp = rowsP[0];\n'+marker,1)
          if s.count('    var rp = rowsP[0];')!=2: raise SystemExit('unexpected rp count')
          first=s.index('    var rp = rowsP[0];'); second=s.index('    var rp = rowsP[0];',first+1)
          s=s[:second]+s[second+len('    var rp = rowsP[0];\n'):]
          p.write_text(s)

          assert "'Pengukuran',\n        'Beranda'" in Path(d).read_text()
          assert Path(a).read_text().count('&token=${Uri.encodeComponent(token)}') >= 3
          assert 'jadwalPadamMobileRouter_(e, body)' in Path(c).read_text()
          z=Path(t).read_text(); assert z.index('var rp = rowsP[0];') < z.index('barisUlpCocok_(g, rp[COL_P0.ulp])')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-verified-release-blockers.yml
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart SiSi_Mobile/lib/services/api_service.dart SiSi_BackEnd/Core/Code.js SiSi_BackEnd/Core/Tek-MobileDual.js
          git commit -m 'fix: clear four verified mobile release blockers'
          git push origin HEAD:main
