name: Audit engine guards

on:
  push:
    branches: [feat/engine-free-tier-guard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [ba-pdf-engine, row-pdf-engine, wm-engine]
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m py_compile engines/${{ matrix.engine }}/*.py
      - name: Build image
        run: docker build -t sisi-${{ matrix.engine }}:audit engines/${{ matrix.engine }}
      - name: Start image
        run: |
          docker run -d --rm --name sisi-audit -p 18080:8080 sisi-${{ matrix.engine }}:audit
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/ && exit 0
            sleep 2
          done
          docker logs sisi-audit
          exit 1
      - name: Verify payload guard
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            -H 'Content-Length: 15000001' http://127.0.0.1:18080/not-a-route || true)
          test "$code" = "413"
          grep -q PAYLOAD_TOO_LARGE /tmp/body
      - if: always()
        run: docker rm -f sisi-audit 2>/dev/null || true
