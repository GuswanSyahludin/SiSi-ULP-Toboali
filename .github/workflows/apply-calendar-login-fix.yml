# Registered workflow trigger
name: Apply calendar and login fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-calendar-login-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Flutter source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          theme = Path('SiSi_Mobile/lib/theme/app_theme.dart')
          s = theme.read_text()
          old = '        showDragHandle: true,'
          if s.count(old) != 1:
              raise SystemExit(f'theme drag handle marker count={s.count(old)}')
          theme.write_text(s.replace(old, '        showDragHandle: false,', 1))

          jadwal = Path('SiSi_Mobile/lib/screens/jadwal_padam_screen.dart')
          s = jadwal.read_text()
          s = s.replace('  late DateTime _to;\n', '  late DateTime _to;\n  late DateTime _selectedDate;\n', 1)
          s = s.replace('    _to = DateTime(now.year, now.month + 1, 0);\n    _boot();', '    _to = DateTime(now.year, now.month + 1, 0);\n    _selectedDate = DateTime(now.year, now.month, now.day);\n    _boot();', 1)
          marker = '  List<String> get _penyulangOptions {\n'
          insert = '''  List<Map<String, dynamic>> get _selectedRows => _rows
      .where((row) => '${row['tanggal'] ?? ''}' == _iso(_selectedDate))
      .toList();

  Set<String> get _eventDates =>
      _rows.map((row) => '${row['tanggal'] ?? ''}').toSet();

  Future<void> _changeMonth(int delta) async {
    final month = DateTime(_from.year, _from.month + delta, 1);
    setState(() {
      _from = month;
      _to = DateTime(month.year, month.month + 1, 0);
      _selectedDate = month;
    });
    await _load();
  }

'''
          s = s.replace(marker, insert + marker, 1)
          s = s.replace('            SliverToBoxAdapter(child: _filters()),\n            if (_loading)', '''            SliverToBoxAdapter(child: _filters()),
            SliverToBoxAdapter(child: _calendar()),
            SliverToBoxAdapter(
              child: Padding(
                padding: const EdgeInsets.fromLTRB(16, 18, 16, 10),
                child: Row(children: [
                  Expanded(child: Text(DateFormat('dd MMMM yyyy', 'id_ID').format(_selectedDate), style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w900, color: AppColors.navy900))),
                  Text('${_selectedRows.length} jadwal', style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w700, color: Color(0xFF667085))),
                ]),
              ),
            ),
            if (_loading)''', 1)
          s = s.replace("else if (_rows.isEmpty)\n              SliverFillRemaining(hasScrollBody: false, child: _StateView(icon: Icons.event_available_rounded, title: 'Tidak ada jadwal', message: 'Coba periode atau filter lain.', action: _load))", "else if (_selectedRows.isEmpty)\n              SliverToBoxAdapter(child: _StateView(icon: Icons.event_available_rounded, title: 'Tidak ada jadwal', message: 'Pilih tanggal bertanda atau ubah filter.', action: _load))", 1)
          s = s.replace('itemCount: _rows.length,\n                  separatorBuilder: (_, __) => const SizedBox(height: 12),\n                  itemBuilder: (_, i) => _schedule(_rows[i]),', 'itemCount: _selectedRows.length,\n                  separatorBuilder: (_, __) => const SizedBox(height: 12),\n                  itemBuilder: (_, i) => _schedule(_selectedRows[i]),', 1)
          marker = '  Widget _filters() {\n'
          calendar = '''  Widget _calendar() {
    final first = DateTime(_from.year, _from.month, 1);
    final days = DateTime(_from.year, _from.month + 1, 0).day;
    final offset = first.weekday % 7;
    const weekdays = ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'];
    return Container(
      margin: const EdgeInsets.fromLTRB(16, 2, 16, 0),
      padding: const EdgeInsets.fromLTRB(14, 14, 14, 16),
      decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(20), border: Border.all(color: const Color(0xFFDDE3EC))),
      child: Column(children: [
        Row(children: [
          IconButton(onPressed: _loading ? null : () => _changeMonth(-1), icon: const Icon(Icons.chevron_left_rounded)),
          Expanded(child: Text(DateFormat('MMMM yyyy', 'id_ID').format(_from), textAlign: TextAlign.center, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w900, color: AppColors.navy900))),
          IconButton(onPressed: _loading ? null : () => _changeMonth(1), icon: const Icon(Icons.chevron_right_rounded)),
        ]),
        GridView.count(shrinkWrap: true, physics: const NeverScrollableScrollPhysics(), crossAxisCount: 7, childAspectRatio: 1.25, children: weekdays.map((day) => Center(child: Text(day, style: const TextStyle(fontSize: 9, letterSpacing: .6, fontWeight: FontWeight.w800, color: Color(0xFF98A2B3))))).toList()),
        GridView.builder(
          shrinkWrap: true,
          physics: const NeverScrollableScrollPhysics(),
          itemCount: offset + days,
          gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 7, childAspectRatio: 1),
          itemBuilder: (_, index) {
            if (index < offset) return const SizedBox();
            final day = index - offset + 1;
            final date = DateTime(_from.year, _from.month, day);
            final selected = _iso(date) == _iso(_selectedDate);
            final hasEvent = _eventDates.contains(_iso(date));
            final today = _iso(date) == _iso(DateTime.now());
            return InkWell(
              onTap: () => setState(() => _selectedDate = date),
              borderRadius: BorderRadius.circular(12),
              child: Container(
                margin: const EdgeInsets.all(2),
                decoration: BoxDecoration(color: selected ? AppColors.navy700 : Colors.transparent, borderRadius: BorderRadius.circular(12), border: today && !selected ? Border.all(color: AppColors.navy700, width: 1.3) : null),
                child: Stack(alignment: Alignment.center, children: [
                  Text('$day', style: TextStyle(fontSize: 12, fontWeight: FontWeight.w800, color: selected ? Colors.white : AppColors.navy900)),
                  if (hasEvent) Positioned(bottom: 4, child: Container(width: 5, height: 5, decoration: BoxDecoration(color: selected ? AppColors.amber600 : AppColors.cyan600, shape: BoxShape.circle))),
                ]),
              ),
            );
          },
        ),
      ]),
    );
  }

'''
          s = s.replace(marker, calendar + marker, 1)
          jadwal.write_text(s)
          assert 'showDragHandle: false' in theme.read_text()
          assert 'Widget _calendar()' in jadwal.read_text()
          assert 'itemCount: _selectedRows.length' in jadwal.read_text()
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-calendar-login-fix.yml
          git add SiSi_Mobile/lib/theme/app_theme.dart SiSi_Mobile/lib/screens/jadwal_padam_screen.dart
          git commit -m "fix(mobile): calendar schedule and single login handle"
          git push origin HEAD:main
