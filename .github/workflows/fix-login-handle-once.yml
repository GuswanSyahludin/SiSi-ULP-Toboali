name: Fix login handle once
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-login-handle-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          sed -i 's/showDragHandle: true/showDragHandle: false/' SiSi_Mobile/lib/theme/app_theme.dart
          grep -q 'showDragHandle: false' SiSi_Mobile/lib/theme/app_theme.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-login-handle-once.yml
          git add SiSi_Mobile/lib/theme/app_theme.dart
          git commit -m "fix(mobile): remove duplicate login sheet handle"
          git push origin HEAD:main
