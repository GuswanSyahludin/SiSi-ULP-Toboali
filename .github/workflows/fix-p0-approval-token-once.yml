name: Fix P0 approval token once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fix_p0_approval_token.py
      - .github/workflows/fix-p0-approval-token-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch approval token injection
        run: python scripts/fix_p0_approval_token.py
      - name: Verify
        run: grep -q '"setApprovalP0"' SiSi_BackEnd/Core/Main.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Core/Main.html
          git commit -m "fix(web): pass session token to P0 approval" || exit 0
          git push origin main
