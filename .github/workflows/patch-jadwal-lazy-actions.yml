name: Patch Jadwal Lazy Actions
on:
  push:
    branches: [fix/jadwal-padam-lazy-results-actions]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-lazy-results-actions
      - run: python .github/scripts/patch_jadwal_lazy_actions.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): lazy-load results and contextualize status actions [skip ci]" || exit 0
          git push origin fix/jadwal-padam-lazy-results-actions
