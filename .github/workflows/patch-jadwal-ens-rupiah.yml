name: Patch Jadwal ENS Rupiah
on:
  push:
    branches: [fix/jadwal-padam-ens-rupiah]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-ens-rupiah
      - run: python .github/scripts/patch_jadwal_ens_rupiah.py
      - run: |
          grep -q 'JADWAL_PADAM_TARIF_KWH = 1444.70' SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          grep -q 'ENS (Rupiah)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'jpRupiah(x.ensRupiah)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): calculate ENS in rupiah [skip ci]" || exit 0
          git push origin fix/jadwal-padam-ens-rupiah
