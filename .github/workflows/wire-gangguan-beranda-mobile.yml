name: Wire gangguan beranda mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/wire-gangguan-beranda-mobile.yml]
permissions: {contents: write}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SiSi_BackEnd/Core/Code.js');s=p.read_text()
          a='''  if (typeof authPerangkatRouter_ === "function") {\n    var lewatAuth = authPerangkatRouter_(e, body);\n    if (lewatAuth) return lewatAuth;\n  }'''
          b=a+'''\n\n  if (typeof gangguanBerandaMobileRouter_ === "function") {\n    var lewatGangguan = gangguanBerandaMobileRouter_(e, body);\n    if (lewatGangguan) return ContentService.createTextOutput(JSON.stringify(lewatGangguan)).setMimeType(ContentService.MimeType.JSON);\n  }'''
          if 'gangguanBerandaMobileRouter_' not in s:s=s.replace(a,b,1)
          p.write_text(s)
          p=Path('SiSi_Mobile/lib/screens/beranda_screen.dart');s=p.read_text()
          if "gangguan_beranda_section.dart" not in s:s=s.replace("import '../theme/app_colors.dart';","import '../theme/app_colors.dart';\nimport 'gangguan_beranda_section.dart';")
          marker='''            _profile(name),\n            const SizedBox(height: 26),'''
          repl='''            _profile(name),\n            const SizedBox(height: 26),\n            GangguanBerandaSection(sesi: widget.sesi),\n            const SizedBox(height: 30),'''
          s=s.replace(marker,repl,1);p.write_text(s)
          PY
          rm .github/workflows/wire-gangguan-beranda-mobile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Core/Code.js SiSi_Mobile/lib/screens/beranda_screen.dart .github/workflows/
          git commit -m "feat(mobile-home): wire disruption charts into home"
          git push origin HEAD:main
