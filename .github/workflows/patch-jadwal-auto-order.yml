name: Patch Jadwal Auto Order
on:
  push:
    branches: [fix/jadwal-padam-auto-date-order]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-auto-date-order
      - run: python .github/scripts/patch_jadwal_auto_order.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "fix(web): auto-sort schedules and recover empty month [skip ci]" || exit 0
          git push origin fix/jadwal-padam-auto-date-order
