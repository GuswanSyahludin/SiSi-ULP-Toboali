name: Apply CheckPoint exports
on:
  push:
    branches: [feat/checkpoint-temuan-multiselect]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkpoint-temuan-multiselect
      - name: Add export menu and client exporters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html')
          s=p.read_text()
          css='''  .dpg-export{position:relative;margin-left:auto;align-self:flex-end;}\n  .dpg-export-btn{min-height:36px;border:1px solid var(--primary);border-radius:7px;padding:7px 12px;background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}\n  .dpg-export-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}\n  .dpg-export-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:1200;min-width:170px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-lg);}\n  .dpg-export.open .dpg-export-menu{display:block;}\n  .dpg-export-menu button{width:100%;border:0;border-radius:6px;padding:9px 10px;background:transparent;color:var(--text);text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;}\n  .dpg-export-menu button:hover{background:var(--surface-2);}\n  .dpg-export-menu button:disabled{opacity:.55;cursor:not-allowed;}\n'''
          anchor='  /* KPI cards (Total / PMT / Section) */'
          if anchor not in s: raise SystemExit('CSS anchor missing')
          s=s.replace(anchor,css+anchor,1)
          old='''          </div>\n        </div>\n      </div>\n      <div id="dpgRekapWrap">'''
          new='''          </div>\n        </div>\n        <div class="dpg-export" id="dpgRekapExport">\n          <button type="button" class="dpg-export-btn" onclick="dpgExportToggle(event)" aria-expanded="false"><i class="fa-solid fa-file-arrow-down"></i> Export <i class="fa-solid fa-chevron-down"></i></button>\n          <div class="dpg-export-menu"><button type="button" onclick="dpgExportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button><button type="button" id="dpgExportPdfBtn" onclick="dpgExportPdf()"><i class="fa-solid fa-file-pdf"></i> PDF</button></div>\n        </div>\n      </div>\n      <div id="dpgRekapWrap">'''
          if old not in s: raise SystemExit('filter layout marker missing')
          s=s.replace(old,new,1)
          marker='''  function dpgRenderRekapTemuan(res){ DPG._rekapRes=res; dpgRekapRender(); }'''
          funcs='''  function dpgExportRows(){\n    var res=DPG._rekapRes||{},sections=res.sections||[],all=res.rows||[],selected=DPG.rekapTemuan||[],pick={};\n    selected.forEach(function(x){pick[String(x).toLowerCase()]=true;});\n    var rows=selected.length?all.filter(function(r){return pick[String(r.temuan||'').toLowerCase()];}):all;\n    var headers=['No','Tier','Temuan','Volume','Satuan'].concat(sections);\n    return {headers:headers,rows:rows.map(function(r,i){return [i+1,r.tier||'-',r.temuan||'',r.volume||0,r.unit||''].concat(sections.map(function(x){return r.bySection[x]||0;}));})};\n  }\n  function dpgExportToggle(ev){if(ev)ev.stopPropagation();var w=_el('dpgRekapExport');if(!w)return;var open=w.classList.toggle('open'),b=w.querySelector('.dpg-export-btn');if(b)b.setAttribute('aria-expanded',open?'true':'false');}\n  function dpgDownloadBlob(blob,name){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}\n  function dpgExportName(ext){var p=_el('dpgPenyulang'),y=_el('dpgTahun'),name='Rekap_Temuan_'+(p&&p.value?p.value:'Semua_Penyulang')+'_'+(y?y.value:'')+'.'+ext;return name.replace(/[^a-zA-Z0-9_.-]+/g,'_');}\n  function dpgExportExcel(){var d=dpgExportRows();if(!d.rows.length){alert('Tidak ada data untuk diekspor.');return;}var esc=function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};var html='<html><head><meta charset="utf-8"></head><body><table border="1"><tr>'+d.headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'+d.rows.map(function(r){return '<tr>'+r.map(function(v){return '<td>'+esc(v)+'</td>';}).join('')+'</tr>';}).join('')+'</table></body></html>';dpgDownloadBlob(new Blob(['\\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'}),dpgExportName('xls'));var w=_el('dpgRekapExport');if(w)w.classList.remove('open');}\n  function dpgExportPdf(){var d=dpgExportRows();if(!d.rows.length){alert('Tidak ada data untuk diekspor.');return;}var b=_el('dpgExportPdfBtn');if(b){b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Membuat PDF';}var p=_el('dpgPenyulang'),y=_el('dpgTahun'),sec=_el('dpgSection'),s=_sesi();SisiRun.withSuccessHandler(function(res){if(b){b.disabled=false;b.innerHTML='<i class="fa-solid fa-file-pdf"></i> PDF';}if(!res||!res.ok){alert((res&&res.message)||'PDF gagal dibuat.');return;}var raw=atob(res.base64),bytes=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);dpgDownloadBlob(new Blob([bytes],{type:res.mimeType||'application/pdf'}),res.fileName||dpgExportName('pdf'));var w=_el('dpgRekapExport');if(w)w.classList.remove('open');}).withFailureHandler(function(err){if(b){b.disabled=false;b.innerHTML='<i class="fa-solid fa-file-pdf"></i> PDF';}alert('PDF gagal dibuat: '+((err&&err.message)||err));}).exportDpgRekapTemuanPdf({token:s.token||'',headers:d.headers,rows:d.rows,title:'Rekap Temuan Inspeksi',subtitle:'Penyulang: '+(p&&p.value?p.value:'Semua')+' | Section: '+(sec&&sec.value?sec.value:'Semua')+' | Tahun: '+(y?y.value:''),fileName:dpgExportName('pdf').replace(/\\.pdf$/,'')});}\n\n'''+marker
          if marker not in s: raise SystemExit('function marker missing')
          s=s.replace(marker,funcs,1)
          expose='''  window.dpgRekapTemuanSelectAll=dpgRekapTemuanSelectAll;'''
          extra=expose+'''\n  window.dpgExportToggle=dpgExportToggle;\n  window.dpgExportExcel=dpgExportExcel;\n  window.dpgExportPdf=dpgExportPdf;'''
          s=s.replace(expose,extra,1)
          click="document.addEventListener('click',function(ev){var ms=_el('dpgRekapTemuanMs');"
          replace="document.addEventListener('click',function(ev){var ex=_el('dpgRekapExport');if(ex&&ex.classList.contains('open')&&!ex.contains(ev.target)){ex.classList.remove('open');var eb=ex.querySelector('.dpg-export-btn');if(eb)eb.setAttribute('aria-expanded','false');}var ms=_el('dpgRekapTemuanMs');"
          s=s.replace(click,replace,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node --check SiSi_BackEnd/Teknik/ZZ-Data-Checkpoint-Export.js
          grep -q 'dpgExportExcel' SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html
          grep -q 'dpgExportPdf' SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html
          git commit -m "feat(checkpoint): wire Excel and PDF exports"
          git push origin HEAD:feat/checkpoint-temuan-multiselect
