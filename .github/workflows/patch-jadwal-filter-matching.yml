name: Patch Jadwal Filter Matching
on:
  push:
    branches: [fix/jadwal-padam-filter-matching]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-filter-matching
      - run: python .github/scripts/patch_jadwal_filter_matching.py
      - run: |
          grep -q 'function _jpUlpKey_' SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          grep -q 'oktober:10' SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "fix(web): match ULP and localized dates in Jadwal Padam [skip ci]" || exit 0
          git push origin fix/jadwal-padam-filter-matching
