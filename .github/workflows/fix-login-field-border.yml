# trigger through normal merge
name: Fix login field border
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-login-field-border.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('SiSi_Mobile/lib/screens/login_screen.dart')
          s=p.read_text()
          old='''          isDense: true,
          border: InputBorder.none,
          // Padding atas-bawah sama besar = teks benar-benar di tengah kolom
'''
          new='''          isDense: true,
          border: InputBorder.none,
          enabledBorder: InputBorder.none,
          focusedBorder: InputBorder.none,
          disabledBorder: InputBorder.none,
          errorBorder: InputBorder.none,
          focusedErrorBorder: InputBorder.none,
          // Border hanya digambar oleh Container luar agar tidak bertumpuk.
'''
          if s.count(old)!=1: raise SystemExit(f'login marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-login-field-border.yml
          git add SiSi_Mobile/lib/screens/login_screen.dart
          git commit -m "fix(mobile): draw one border around login fields"
          git push origin HEAD:main
