name: Patch Jadwal Status Actions
on:
  push:
    branches: [feat/jadwal-padam-status-actions]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jadwal-padam-status-actions
      - run: python .github/scripts/patch_jadwal_status_actions.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "feat(web): add Jadwal filters, sort, and status actions [skip ci]" || exit 0
          git push origin feat/jadwal-padam-status-actions
