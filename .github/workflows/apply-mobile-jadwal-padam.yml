name: Apply mobile Jadwal Padam wiring

on:
  push:
    branches: [feat/mobile-jadwal-padam]
    paths: [.github/workflows/apply-mobile-jadwal-padam.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-jadwal-padam
      - name: Wire router and Teknik menu
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('SiSi_BackEnd/Core/Auth-Perangkat.js')
          text = auth.read_text()
          old = '''  var action = String((body && body.action) || p.action || "").trim();
          if (AUTH_PERANGKAT_ACTIONS.indexOf(action) < 0) return null;'''
          new = '''  var action = String((body && body.action) || p.action || "").trim();
          if (typeof jadwalPadamMobileRouter_ === "function") {
            var lewatJadwal = jadwalPadamMobileRouter_(e, body);
            if (lewatJadwal) return _devJson_(lewatJadwal);
          }
          if (AUTH_PERANGKAT_ACTIONS.indexOf(action) < 0) return null;'''
          if old not in text:
            raise SystemExit('Auth router anchor not found')
          auth.write_text(text.replace(old, new, 1))

          dashboard = Path('SiSi_Mobile/lib/screens/dashboard_screen.dart')
          text = dashboard.read_text()
          import_anchor = "import 'engine_usage_screen.dart';"
          if "import 'jadwal_padam_screen.dart';" not in text:
            text = text.replace(import_anchor, import_anchor + "\nimport 'jadwal_padam_screen.dart';", 1)

          list_anchor = '''    final List<Map<String, dynamic>> subTeknik = [
                {'''
          list_new = '''    final List<Map<String, dynamic>> subTeknik = [
                {
                  'title': 'Jadwal Padam',
                  'icon': Icons.calendar_month_rounded,
                  'desc': 'Rencana pemadaman, dampak pelanggan, status, dan laporan WA',
                  'iconColor': AppColors.plnRed,
                },
                {'''
          if "'title': 'Jadwal Padam'" not in text:
            if list_anchor not in text:
              raise SystemExit('Teknik menu anchor not found')
            text = text.replace(list_anchor, list_new, 1)

          route_anchor = '''                  if (title == 'Input Temuan') {
                            tujuan = InputTemuanTeknikScreen(sesi: widget.sesi);'''
          route_new = '''                  if (title == 'Jadwal Padam') {
                            tujuan = JadwalPadamScreen(
                              sesi: widget.sesi,
                              onBack: () => setState(() => _activeSubScreen = null),
                            );
                          } else if (title == 'Input Temuan') {
                            tujuan = InputTemuanTeknikScreen(sesi: widget.sesi);'''
          if 'tujuan = JadwalPadamScreen(' not in text:
            if route_anchor not in text:
              raise SystemExit('Teknik route anchor not found')
            text = text.replace(route_anchor, route_new, 1)
          dashboard.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-mobile-jadwal-padam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Core/Auth-Perangkat.js SiSi_Mobile/lib/screens/dashboard_screen.dart .github/workflows/apply-mobile-jadwal-padam.yml
          git commit -m "Wire Jadwal Padam into Teknik mobile menu"
          git push origin HEAD:feat/mobile-jadwal-padam
