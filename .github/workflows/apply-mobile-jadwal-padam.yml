name: Apply mobile Jadwal Padam wiring

on:
  push:
    branches: [feat/mobile-jadwal-padam]
    paths: [.github/workflows/apply-mobile-jadwal-padam.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-jadwal-padam
      - name: Patch router and dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('SiSi_BackEnd/Core/Auth-Perangkat.js')
          text = auth.read_text()
          anchor = '  if (AUTH_PERANGKAT_ACTIONS.indexOf(action) < 0) return null;'
          if 'var lewatJadwal =' not in text:
            assert anchor in text
            text = text.replace(anchor, '''  if (typeof jadwalPadamMobileRouter_ === "function") {
            var lewatJadwal = jadwalPadamMobileRouter_(e, body);
            if (lewatJadwal) return _devJson_(lewatJadwal);
          }
          ''' + anchor, 1)
          auth.write_text(text)

          dashboard = Path('SiSi_Mobile/lib/screens/dashboard_screen.dart')
          text = dashboard.read_text()
          if "import 'jadwal_padam_screen.dart';" not in text:
            anchor = "import 'engine_usage_screen.dart';"
            assert anchor in text
            text = text.replace(anchor, anchor + "\nimport 'jadwal_padam_screen.dart';", 1)

          if "'title': 'Jadwal Padam'" not in text:
            anchor = '    final List<Map<String, dynamic>> subTeknik = ['
            assert anchor in text
            item = """
                {
                  'title': 'Jadwal Padam',
                  'icon': Icons.calendar_month_rounded,
                  'desc': 'Rencana pemadaman, dampak pelanggan, status, dan laporan WA',
                  'iconColor': AppColors.plnRed,
                },"""
            text = text.replace(anchor, anchor + item, 1)

          if 'tujuan = JadwalPadamScreen(' not in text:
            anchor = "                  if (title == 'Input Temuan') {"
            assert anchor in text
            replacement = """                  if (title == 'Jadwal Padam') {
                    tujuan = JadwalPadamScreen(
                      sesi: widget.sesi,
                      onBack: () => setState(() => _activeSubScreen = null),
                    );
                  } else if (title == 'Input Temuan') {"""
            text = text.replace(anchor, replacement, 1)
          dashboard.write_text(text)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Core/Auth-Perangkat.js SiSi_Mobile/lib/screens/dashboard_screen.dart
          git commit -m "Wire Jadwal Padam into Teknik mobile menu"
          git push origin HEAD:feat/mobile-jadwal-padam
