name: Apply centered Beranda navigation

on:
  push:
    branches: [feat/mobile-jadwal-padam]
    paths: [.github/workflows/apply-mobile-jadwal-padam.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-jadwal-padam
      - name: Patch dashboard navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('SiSi_Mobile/lib/screens/dashboard_screen.dart')
          s=p.read_text()
          if "import 'beranda_screen.dart';" not in s:
            s=s.replace("import 'jadwal_padam_screen.dart';", "import 'jadwal_padam_screen.dart';\nimport 'beranda_screen.dart';",1)

          menu='''  List<String> get currentMenuItems {
            if (_isSuperUser) {
              return ['Tim', 'Gardu', 'Beranda', 'Teknik', 'Pengaturan'];
            }
            if (_bolehGardu) {
              return ['Tim', 'Gardu', 'Beranda', 'Pengaturan'];
            }
            return ['Tim', 'Beranda', 'Pengaturan'];
          }

          List<IconData> get currentMenuIcons {'''
          s,n=re.subn(r'  List<String> get currentMenuItems \{.*?\n  List<IconData> get currentMenuIcons \{',menu,s,count=1,flags=re.S)
          assert n==1
          icons='''  List<IconData> get currentMenuIcons {
            if (_isSuperUser) {
              return [
                Icons.people_outline_rounded,
                Icons.electrical_services_outlined,
                Icons.home_rounded,
                Icons.handyman_outlined,
                Icons.settings_outlined,
              ];
            }
            if (_bolehGardu) {
              return [
                Icons.people_outline_rounded,
                Icons.electrical_services_outlined,
                Icons.home_rounded,
                Icons.settings_outlined,
              ];
            }
            return [
              Icons.people_outline_rounded,
              Icons.home_rounded,
              Icons.settings_outlined,
            ];
          }

          void _selectMenu'''
          s,n=re.subn(r'  List<IconData> get currentMenuIcons \{.*?\n  void _selectMenu',icons,s,count=1,flags=re.S)
          assert n==1

          init='''    _bubbleController = AnimationController(vsync: this);
              selectedIndex = currentMenuItems.indexOf('Beranda');
              previousIndex = selectedIndex;
              _bubbleController.value = 1;
              unawaited(AutoSyncService.syncNow(widget.sesi));'''
          s=s.replace("    _bubbleController = AnimationController(vsync: this);\n    unawaited(AutoSyncService.syncNow(widget.sesi));",init,1)

          back='''  void _kembaliKeAwal() {
            setState(() {
              previousIndex = selectedIndex;
              selectedIndex = currentMenuItems.indexOf('Beranda');
              _activeSubScreen = null;
              _selectedTeamDetail = null;
            });
          }

          Future<void> _cekKoneksi'''
          s,n=re.subn(r'  void _kembaliKeAwal\(\) \{.*?\n  Future<void> _cekKoneksi',back,s,count=1,flags=re.S)
          assert n==1

          if "case 'Beranda':" not in s:
            anchor="      case 'Gardu':\n        return GarduScreen(sesi: widget.sesi);"
            assert anchor in s
            s=s.replace(anchor,anchor+"\n      case 'Beranda':\n        return BerandaScreen(sesi: widget.sesi);",1)
          p.write_text(s)
          PY
      - name: Commit navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart
          git commit -m "Add centered Beranda navigation"
          git push origin HEAD:feat/mobile-jadwal-padam
