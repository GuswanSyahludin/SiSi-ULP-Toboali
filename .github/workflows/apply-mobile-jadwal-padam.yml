name: Audit Jadwal Padam Mobile

on:
  pull_request:
    paths:
      - "SiSi_BackEnd/Core/Jadwal-Padam-Mobile.js"
      - "SiSi_BackEnd/Core/Auth-Perangkat.js"
      - "SiSi_Mobile/lib/screens/jadwal_padam_screen.dart"
      - "SiSi_Mobile/lib/services/jadwal_padam_service.dart"
      - "SiSi_Mobile/lib/screens/dashboard_screen.dart"
      - ".github/workflows/apply-mobile-jadwal-padam.yml"
  push:
    branches: [main]
    paths:
      - "SiSi_BackEnd/Core/Jadwal-Padam-Mobile.js"
      - "SiSi_BackEnd/Core/Auth-Perangkat.js"
      - "SiSi_Mobile/lib/screens/jadwal_padam_screen.dart"
      - "SiSi_Mobile/lib/services/jadwal_padam_service.dart"
      - "SiSi_Mobile/lib/screens/dashboard_screen.dart"
      - ".github/workflows/apply-mobile-jadwal-padam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Teknik menu and route
        run: |
          grep -q "import 'jadwal_padam_screen.dart';" SiSi_Mobile/lib/screens/dashboard_screen.dart
          grep -q "'title': 'Jadwal Padam'" SiSi_Mobile/lib/screens/dashboard_screen.dart
          grep -q "tujuan = JadwalPadamScreen" SiSi_Mobile/lib/screens/dashboard_screen.dart
      - name: Verify guarded mobile API gateway
        run: |
          grep -q 'jadwalPadamMobileRouter_' SiSi_BackEnd/Core/Auth-Perangkat.js
          grep -q 'getMobileJadwalPadamList' SiSi_BackEnd/Core/Jadwal-Padam-Mobile.js
          grep -q 'simpanMobileJadwalPadam' SiSi_BackEnd/Core/Jadwal-Padam-Mobile.js
          grep -q 'updateMobileStatusJadwalPadam' SiSi_BackEnd/Core/Jadwal-Padam-Mobile.js
      - name: Reject deployment commands
        run: |
          ! grep -R -n -E 'gcloud (run deploy|builds submit)|firebase deploy|clasp push' \
            SiSi_BackEnd/Core/Jadwal-Padam-Mobile.js \
            SiSi_Mobile/lib/screens/jadwal_padam_screen.dart \
            SiSi_Mobile/lib/services/jadwal_padam_service.dart
