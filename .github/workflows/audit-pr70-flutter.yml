name: Audit PR 70 Flutter

on:
  push:
    branches:
      - feat/row-google-maps-zero-cost
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-pr70-flutter
  cancel-in-progress: false

jobs:
  lock-analyze-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and verify lockfile
        working-directory: SiSi_Mobile
        run: flutter pub get

      - name: Reject a stale lockfile
        run: git diff --exit-code -- SiSi_Mobile/pubspec.lock

      - name: Analyze Flutter source
        working-directory: SiSi_Mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android debug APK
        working-directory: SiSi_Mobile
        run: flutter build apk --debug
