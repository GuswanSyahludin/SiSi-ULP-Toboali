name: Patch Jadwal Unique Feeders
on:
  push:
    branches: [fix/jadwal-padam-unique-feeders]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-unique-feeders
      - run: python .github/scripts/patch_jadwal_unique_feeders.py
      - run: |
          grep -q 'function jpKey' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'uniquePenyulang' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'this.showPicker' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          ! grep -q 'id="mTipe"' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          ! grep -q 'id="mKeterangan"' SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): use unique feeder values [skip ci]" || exit 0
          git push origin fix/jadwal-padam-unique-feeders
