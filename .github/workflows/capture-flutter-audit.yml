name: Capture Flutter audit diagnostics
on:
  push:
    branches: [feat/mobile-jadwal-padam]
    paths: [.github/workflows/capture-flutter-audit.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-jadwal-padam
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: SiSi_Mobile
        run: flutter pub get
      - name: Capture analyzer output
        run: |
          cd SiSi_Mobile
          flutter analyze --no-fatal-infos --no-fatal-warnings > ../flutter-audit.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-audit.txt
          git commit -m "Capture Flutter audit diagnostics"
          git push origin HEAD:feat/mobile-jadwal-padam
