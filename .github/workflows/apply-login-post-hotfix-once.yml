name: Apply login POST hotfix once
on:
  push:
    branches: [fix/predeploy-appscript-audit-v2]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/predeploy-appscript-audit-v2
      - name: Move credentials from URL to JSON body
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SiSi_Mobile/lib/services/api_service.dart')
          s=p.read_text()
          old='''    final uri = Uri.parse(\n      '$baseUrl?mobile=1&action=loginPerangkat'\n      '&username=${Uri.encodeComponent(username)}'\n      '&password=${Uri.encodeComponent(password)}'\n      '&perangkat=${Uri.encodeComponent(_namaPerangkat())}',\n    );\n    // 30 dtk: cold start Apps Script bisa lewat 15 dtk.\n    final res = await http.get(uri).timeout(const Duration(seconds: 30));'''
          new='''    final uri = Uri.parse('$baseUrl?mobile=1');\n    // Kredensial wajib di body POST: tidak masuk URL, history, atau access log.\n    final res = await http\n        .post(\n          uri,\n          headers: {'Content-Type': 'application/json'},\n          body: jsonEncode({\n            'action': 'loginPerangkat',\n            'username': username,\n            'password': password,\n            'perangkat': _namaPerangkat(),\n          }),\n        )\n        .timeout(const Duration(seconds: 30));'''
          if old not in s: raise SystemExit('loginPerangkat block not found')
          s=s.replace(old,new,1)
          old2='''    final uri = Uri.parse(\n      '$baseUrl?mobile=1&action=login&username=${Uri.encodeComponent(username)}&password=${Uri.encodeComponent(password)}',\n    );\n    // Rev 19 Agu sore: 15 → 30 dtk (cold start Apps Script bisa lewat 15 dtk)\n    final res = await http.get(uri).timeout(const Duration(seconds: 30));'''
          new2='''    final uri = Uri.parse('$baseUrl?mobile=1');\n    final res = await http\n        .post(\n          uri,\n          headers: {'Content-Type': 'application/json'},\n          body: jsonEncode({\n            'action': 'login',\n            'username': username,\n            'password': password,\n          }),\n        )\n        .timeout(const Duration(seconds: 30));'''
          if old2 not in s: raise SystemExit('legacy login block not found')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-login-post-hotfix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(auth): send login credentials in POST body" || exit 0
          git push
