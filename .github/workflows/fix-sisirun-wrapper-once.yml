name: Fix SisiRun wrapper once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/fix_sisirun_wrapper.py
      - .github/workflows/fix-sisirun-wrapper-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch wrapper
        run: python scripts/fix_sisirun_wrapper.py
      - name: Verify patch
        run: |
          grep -q 'runner = runner.withSuccessHandler' SiSi_BackEnd/Core/Main.html
          grep -q 'String(a\[0\]) !== String(t)' SiSi_BackEnd/Core/Main.html
          ! grep -q 'GSR.withSuccessHandler(fn);' SiSi_BackEnd/Core/Main.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Core/Main.html
          git commit -m "fix(web): restore backend callbacks in SisiRun" || exit 0
          git push origin main
