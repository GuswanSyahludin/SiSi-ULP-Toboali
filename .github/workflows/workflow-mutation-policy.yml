name: Workflow mutation policy

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/audit_workflow_mutation.py']
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/audit_workflow_mutation.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject mutating push and PR workflows
        run: python3 scripts/audit_workflow_mutation.py
