name: Apply Inspection report card
on:
  push:
    branches: [fix/inspeksi-report-card]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inspeksi-report-card
          fetch-depth: 0
      - name: Replace seeded Inspection report list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('SiSi_Mobile/lib/screens/inspeksi_jaringan_screen.dart')
          s=p.read_text()
          s=s.replace("import '../theme/app_colors.dart';", "import '../db/repositories/header_repository.dart';\nimport '../theme/app_colors.dart';\nimport '../widgets/laporan_header_card.dart';")
          s=s.replace("  final Map<String, dynamic> sesi;\n  const InspeksiJaringanScreen({super.key, required this.sesi});", "  final Map<String, dynamic> sesi;\n  final String? targetSubTim;\n  const InspeksiJaringanScreen({super.key, required this.sesi, this.targetSubTim});")
          s=s.replace("  final List<Map<String, dynamic>> laporan = [];\n  bool loading = true;", "  final List<Map<String, dynamic>> laporan = [];\n  String get _subTim => widget.targetSubTim ?? widget.sesi['subTim'] ?? 'Inspeksi Jaringan';\n  bool loading = true;")
          load="""  Future<void> _load() async {
    setState(() => loading = true);
    final now = DateTime.now();
    final tanggal = '${now.year}-${now.month.toString().padLeft(2, '0')}-${now.day.toString().padLeft(2, '0')}';
    final response = await HeaderRepository().bacaLaporanHarian(
      token: (widget.sesi['token'] ?? '').toString(),
      subTim: _subTim,
      tanggal: tanggal,
    );
    if (!mounted) return;
    final data = response['success'] == true
        ? List<dynamic>.from(response['data'] ?? const [])
        : <dynamic>[];
    setState(() {
      laporan
        ..clear()
        ..addAll(data.map((raw) {
          final item = Map<String, dynamic>.from(raw as Map);
          item.putIfAbsent('realisasi', () => <Map<String, dynamic>>[]);
          return item;
        }));
      loading = false;
    });
  }

"""
          s,n=re.subn(r"  Future<void> _load\(\) async \{.*?\n  \}\n\n  String _namaHari",load+'  String _namaHari',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'load match={n}')
          card="""  Widget _laporanCard(Map<String, dynamic> item) {
    final real = item['realisasi'] as List? ?? const [];
    final totalTiang = real.fold<int>(0, (sum, r) =>
        sum + (int.tryParse('${r['totalTiang']}') ?? 0));
    return LaporanHeaderCard(
      item: item,
      icon: Icons.alt_route_rounded,
      accent: AppColors.cyan600,
      summary: '${real.length} Penyulang • $totalTiang Total Tiang',
      onTap: () => Navigator.push(
        context,
        MaterialPageRoute(builder: (_) => _LaporanDetail(item: item)),
      ).then((_) => setState(() {})),
      onWa: () => _kirimWa((item['waText'] ?? '').toString()),
    );
  }

  Future<void> _kirimWa(String text) async {
    if (text.trim().isEmpty) return;
    await launchUrl(
      Uri.parse('https://api.whatsapp.com/send?text=${Uri.encodeComponent(text)}'),
      mode: LaunchMode.externalApplication,
    );
  }

"""
          s,n=re.subn(r"  Widget _laporanCard\(Map<String, dynamic> item\) \{.*?\n  \}\n\n  void _buatLaporan",card+'  void _buatLaporan',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'card match={n}')
          p.write_text(s)

          router=Path('SiSi_Mobile/lib/screens/laporan_harian_screen.dart')
          r=router.read_text()
          old='if (!gardu) return InspeksiJaringanScreen(sesi: widget.sesi);'
          if old in r:
            r=r.replace(old,"if (!gardu) return InspeksiJaringanScreen(sesi: widget.sesi, targetSubTim: sub);",1)
            router.write_text(r)
          PY
      - name: Commit source change
        run: |
          rm .github/workflows/apply-inspeksi-card.yml
          rm -f SiSi_Mobile/INSPEKSI_CARD_TRIGGER.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(inspeksi): restore real report card and WhatsApp action"
          git push origin fix/inspeksi-report-card
