name: Restore full Yandal backend

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-yandal-backend.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore complete Yandal implementation
        run: |
          git show fd4abd88e2eb8ff6a87bcd3628ee97ec3b3bd3c0:SiSi_BackEnd/Yandal/Tek-Yandal-Code.js > SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          test $(wc -c < SiSi_BackEnd/Yandal/Tek-Yandal-Code.js) -gt 150000
          grep -q 'function enqueueP0Yandal_' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          grep -q 'function drainAntreanP0' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          grep -q 'function sweepWmBacklogY' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          grep -q 'function prosesP0Yandal' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          grep -q 'function getTabelPetugasYandal' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          grep -q 'function getDetailPerformaPetugasY' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
          grep -q 'function sinkronRankYandal' SiSi_BackEnd/Yandal/Tek-Yandal-Code.js
      - name: Commit restored backend and remove one-shot workflow
        run: |
          rm .github/workflows/restore-yandal-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Yandal/Tek-Yandal-Code.js .github/workflows/restore-yandal-backend.yml
          git commit -m "fix(yandal): restore complete backend workers and analytics"
          git push origin HEAD:main
