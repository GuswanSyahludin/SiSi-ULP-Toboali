name: Patch Work Status V2
on:
  push:
    branches: [fix/jadwal-padam-work-status-layout-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-work-status-layout-v2
      - run: python .github/scripts/patch_work_status_v2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "feat(web): add Status Pekerjaan and fix table layout [skip ci]" || exit 0
          git push origin fix/jadwal-padam-work-status-layout-v2
