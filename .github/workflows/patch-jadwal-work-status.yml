name: Patch Jadwal Work Status
on:
  push:
    branches: [fix/jadwal-padam-work-status-layout]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-work-status-layout
      - run: python .github/scripts/patch_jadwal_work_status.py
      - run: |
          grep -q 'Status Pekerjaan</th>' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'id="mStatusPekerjaan"' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q "_jpPut_(row,map,statusPekerjaan,'Status Pekerjaan')" SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          ! grep -q '<td class="cell-area">' SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "feat(web): add Status Pekerjaan and fix table layout [skip ci]" || exit 0
          git push origin fix/jadwal-padam-work-status-layout
