# Recovery trigger
name: Restore Code and secure webhook secret
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-code-secret-fix.yml
permissions:
  contents: write
jobs:
  restore-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore Code.js and remove hardcoded secret
        shell: bash
        run: |
          git checkout 415e90565ec563ae72c3304f41405dbfb63123ce -- SiSi_BackEnd/Core/Code.js
          python3 <<'PY'
          from pathlib import Path
          p = Path('SiSi_BackEnd/Core/Code.js')
          s = p.read_text()
          start = s.index('var WEBHOOK_SECRET = ')
          end = s.index('\n', start)
          s = s[:start] + '/* Webhook secret wajib berasal dari Script Property SISI_WEBHOOK_SECRET. */' + s[end:]
          p.write_text(s)
          g = Path('SiSi_BackEnd/Core/Guard.js')
          t = g.read_text()
          old = '  if (p) return p;\n  return typeof WEBHOOK_SECRET !== "undefined" ? String(WEBHOOK_SECRET || "") : "";\n'
          new = '  return p;\n'
          if t.count(old) != 1:
              raise SystemExit('webhook fallback marker not found')
          g.write_text(t.replace(old, new, 1))
          assert p.stat().st_size > 100000
          assert 'jadwalPadamMobileRouter_(e, body)' in p.read_text()
          assert 'var WEBHOOK_SECRET =' not in p.read_text()
          assert 'typeof WEBHOOK_SECRET' not in g.read_text()
          PY
      - name: Commit restored secure source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-code-secret-fix.yml
          git add SiSi_BackEnd/Core/Code.js SiSi_BackEnd/Core/Guard.js
          git commit -m "security: restore core and require Script Properties webhook secret"
          git push origin HEAD:main
