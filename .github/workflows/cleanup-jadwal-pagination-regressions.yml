name: Cleanup Jadwal Pagination Regressions
on:
  push:
    branches: [fix/jadwal-padam-pagination-50]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-pagination-50
      - run: python .github/scripts/cleanup_jadwal_pagination_regressions.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): clean pagination regressions [skip ci]" || exit 0
          git push origin fix/jadwal-padam-pagination-50
