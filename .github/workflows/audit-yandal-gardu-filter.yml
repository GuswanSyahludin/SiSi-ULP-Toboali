name: Audit Yandal Gardu Filter
on:
  push:
    branches: [fix/yandal-gardu-by-feeder]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audit-yandal-gardu-filter
  cancel-in-progress: false
jobs:
  patch-analyze-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/yandal-gardu-by-feeder
      - name: Patch Yandal gardu filter
        run: python .github/scripts/patch_yandal_gardu_filter.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: SiSi_Mobile
        run: flutter pub get
      - name: Reject stale lockfile
        run: git diff --exit-code -- SiSi_Mobile/pubspec.lock
      - name: Analyze Flutter source
        working-directory: SiSi_Mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build Android debug APK
        working-directory: SiSi_Mobile
        run: flutter build apk --debug
      - name: Commit audited implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_Mobile/lib/screens/yandal_screen.dart
          git commit -m "fix(yandal): filter Master Gardu by P0 feeder [skip ci]" || exit 0
          git push origin fix/yandal-gardu-by-feeder
