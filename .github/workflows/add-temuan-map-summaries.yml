name: Add Peta Temuan summaries
on:
  push:
    branches: [feat/mobile-temuan-map]
    paths:
      - '.github/scripts/add_temuan_map_summaries.py'
      - '.github/workflows/add-temuan-map-summaries.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-temuan-map
      - run: python .github/scripts/add_temuan_map_summaries.py
      - run: |
          python -m json.tool .ngodingpakeai/summaries.json > /dev/null
          grep -q 'SiSi_Mobile/lib/screens/peta_temuan_screen.dart' .ngodingpakeai/summaries.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ngodingpakeai/summaries.json
          git commit -m "docs(context): summarize Peta Temuan files"
          git push origin HEAD:feat/mobile-temuan-map
