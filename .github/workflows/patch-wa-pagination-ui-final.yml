name: Patch WA Pagination UI Final
on:
  push:
    branches: [feat/jadwal-padam-whatsapp-report-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jadwal-padam-whatsapp-report-v2
      - run: python .github/scripts/patch_wa_pagination_ui_final.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "feat(web): add final WA report and pagination UI [skip ci]" || exit 0
          git push origin feat/jadwal-padam-whatsapp-report-v2
