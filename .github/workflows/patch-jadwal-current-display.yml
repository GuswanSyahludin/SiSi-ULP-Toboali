name: Patch Jadwal Current Display
on:
  push:
    branches: [fix/jadwal-padam-current-display]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-current-display
      - run: python .github/scripts/patch_jadwal_current_display.py
      - run: |
          grep -q 'item.bebanA' SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          grep -q 'Beban (A)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'text-overflow:ellipsis' SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): show current load and truncate outage areas [skip ci]" || exit 0
          git push origin fix/jadwal-padam-current-display
