name: Patch Jadwal Action Styles
on:
  push:
    branches: [fix/jadwal-padam-action-styles-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-action-styles-v2
      - run: python .github/scripts/patch_jadwal_action_styles.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): center and color status actions [skip ci]" || exit 0
          git push origin fix/jadwal-padam-action-styles-v2
