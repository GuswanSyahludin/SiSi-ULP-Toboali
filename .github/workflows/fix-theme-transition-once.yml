name: Fix Flutter theme transition
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-theme-transition-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch unsupported transition
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('SiSi_Mobile/lib/theme/app_theme.dart')
          s = p.read_text()
          old = 'TargetPlatform.iOS: CupertinoPageTransitionsBuilder(),'
          new = 'TargetPlatform.iOS: FadeForwardsPageTransitionsBuilder(),'
          if s.count(old) != 1:
              raise SystemExit(f'expected one transition marker, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-theme-transition-once.yml
          git add SiSi_Mobile/lib/theme/app_theme.dart
          git commit -m "fix(mobile): use supported page transition builder"
          git push origin HEAD:main
