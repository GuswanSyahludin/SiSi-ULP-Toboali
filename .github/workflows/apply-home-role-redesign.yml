name: Apply home and role redesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-home-role-redesign.yml
      - .github/scripts/apply_home_role_redesign.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch source
        run: python3 .github/scripts/apply_home_role_redesign.py
      - name: Commit source redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-role-redesign.yml
          git rm .github/scripts/apply_home_role_redesign.py
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart SiSi_Mobile/lib/screens/beranda_screen.dart
          git commit -m "feat(mobile): artifact-led Beranda and role-aware navigation"
          git push origin HEAD:main
