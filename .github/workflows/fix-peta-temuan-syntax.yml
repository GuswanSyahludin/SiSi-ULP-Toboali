name: Fix Peta Temuan syntax
on:
  push:
    branches: [fix/map-ux-sync-refresh-forward]
    paths:
      - '.github/scripts/fix_peta_temuan_syntax.py'
      - '.github/workflows/fix-peta-temuan-syntax.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-ux-sync-refresh-forward
      - run: python .github/scripts/fix_peta_temuan_syntax.py
      - name: Validate corrected expressions
        run: |
          grep -q "String get ulp" SiSi_Mobile/lib/screens/peta_temuan_screen.dart
          grep -q "zoom < 9 ? 0.62 : 0.92" SiSi_Mobile/lib/screens/peta_temuan_screen.dart
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_Mobile/lib/screens/peta_temuan_screen.dart
          git commit -m "fix(map): repair adaptive marker expressions"
          git push origin HEAD:fix/map-ux-sync-refresh-forward
