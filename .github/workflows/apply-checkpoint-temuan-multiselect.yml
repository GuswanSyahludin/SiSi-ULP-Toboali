name: Apply checkpoint Temuan multiselect
on:
  push:
    branches: [feat/checkpoint-temuan-multiselect]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkpoint-temuan-multiselect
      - name: Replace single select with accessible multiselect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html')
          s=p.read_text()
          css='''  .dpg-ms{position:relative;min-width:280px;}\n  .dpg-ms-btn{width:100%;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:var(--surface);color:var(--text);cursor:pointer;text-align:left;}\n  .dpg-ms-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}\n  .dpg-ms-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:1200;min-width:320px;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px;}\n  .dpg-ms.open .dpg-ms-menu{display:block;}\n  .dpg-ms-actions{display:flex;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--border);}\n  .dpg-ms-actions button{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px;background:var(--surface-2);color:var(--text);cursor:pointer;}\n  .dpg-ms-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow:auto;padding-top:7px;}\n  .dpg-ms-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--text);cursor:pointer;}\n  .dpg-ms-item:hover{background:var(--surface-2);}\n  .dpg-ms-item input{width:16px;height:16px;accent-color:var(--primary);}\n'''
          anchor='  /* KPI cards (Total / PMT / Section) */'
          if anchor not in s: raise SystemExit('CSS anchor missing')
          s=s.replace(anchor,css+anchor,1)
          old='''        <div class="filter-group">\n          <label>Temuan</label>\n          <select id="dpgRekapTemuan" onchange="dpgRekapFilter()"><option value="">Semua Temuan</option></select>\n        </div>'''
          new='''        <div class="filter-group">\n          <label>Temuan</label>\n          <div class="dpg-ms" id="dpgRekapTemuanMs">\n            <button type="button" class="dpg-ms-btn" onclick="dpgRekapTemuanToggle(event)" aria-expanded="false"><span id="dpgRekapTemuanLabel">Semua Temuan</span><i class="fa-solid fa-chevron-down"></i></button>\n            <div class="dpg-ms-menu">\n              <div class="dpg-ms-actions"><button type="button" onclick="dpgRekapTemuanSelectAll(true)">Pilih Semua</button><button type="button" onclick="dpgRekapTemuanSelectAll(false)">Kosongkan</button></div>\n              <div class="dpg-ms-list" id="dpgRekapTemuanList"><div class="dpg-empty" style="padding:12px">Memuat...</div></div>\n            </div>\n          </div>\n        </div>'''
          if old not in s: raise SystemExit('single select marker missing')
          s=s.replace(old,new,1)
          s=s.replace("var DPG = { sesi:null, ulp:'', isSuper:false, tab:'har' };","var DPG = { sesi:null, ulp:'', isSuper:false, tab:'har', rekapTemuan:[] };",1)
          start=s.index('  function dpgLoadRekapTemuanList(){')
          end=s.index('\n  function dpgRenderRekapTemuan',start)
          funcs='''  function dpgLoadRekapTemuanList(){\n    var listEl=_el('dpgRekapTemuanList'); if(!listEl||typeof google==='undefined') return;\n    SisiRun.withSuccessHandler(function(res){\n      var list=(res&&res.list)?res.list:[]; DPG.rekapTemuan=[];\n      listEl.innerHTML=list.length?list.map(function(n){return '<label class="dpg-ms-item"><input type="checkbox" value="'+_esc(n)+'" onchange="dpgRekapTemuanChange()"><span>'+_esc(n)+'</span></label>';}).join(''):'<div class="dpg-empty" style="padding:12px">Belum ada temuan</div>';\n      dpgRekapTemuanUpdateLabel();\n    }).withFailureHandler(function(){listEl.innerHTML='<div class="dpg-empty" style="padding:12px">Gagal memuat</div>';}).getListTemuanByObjek('');\n  }\n  function dpgRekapTemuanToggle(ev){if(ev)ev.stopPropagation();var ms=_el('dpgRekapTemuanMs');if(!ms)return;var open=ms.classList.toggle('open');var btn=ms.querySelector('.dpg-ms-btn');if(btn)btn.setAttribute('aria-expanded',open?'true':'false');}\n  function dpgRekapTemuanChange(){var list=_el('dpgRekapTemuanList'),out=[];if(list){list.querySelectorAll('input[type=checkbox]').forEach(function(c){if(c.checked)out.push(c.value);});}DPG.rekapTemuan=out;dpgRekapTemuanUpdateLabel();dpgRekapRender();}\n  function dpgRekapTemuanSelectAll(on){var list=_el('dpgRekapTemuanList'),out=[];if(list){list.querySelectorAll('input[type=checkbox]').forEach(function(c){c.checked=!!on;if(on)out.push(c.value);});}DPG.rekapTemuan=out;dpgRekapTemuanUpdateLabel();dpgRekapRender();}\n  function dpgRekapTemuanUpdateLabel(){var label=_el('dpgRekapTemuanLabel'),n=DPG.rekapTemuan.length;if(label)label.textContent=n===0?'Semua Temuan':(n===1?DPG.rekapTemuan[0]:n+' temuan dipilih');}\n'''
          s=s[:start]+funcs+s[end:]
          oldfilter="var sections=res.sections||[], all=res.rows||[], selected=_el('dpgRekapTemuan')?_el('dpgRekapTemuan').value:'';\n    var rows=selected?all.filter(function(r){return String(r.temuan||'')===selected;}):all;"
          newfilter="var sections=res.sections||[], all=res.rows||[], selected=DPG.rekapTemuan||[], selectedMap={};\n    selected.forEach(function(x){selectedMap[String(x).toLowerCase()]=true;});\n    var rows=selected.length?all.filter(function(r){return selectedMap[String(r.temuan||'').toLowerCase()];}):all;"
          if oldfilter not in s: raise SystemExit('filter marker missing')
          s=s.replace(oldfilter,newfilter,1)
          expose="  window.dpgRekapFilter=dpgRekapFilter;"
          extra="  window.dpgRekapFilter=dpgRekapFilter;\n  window.dpgRekapTemuanToggle=dpgRekapTemuanToggle;\n  window.dpgRekapTemuanChange=dpgRekapTemuanChange;\n  window.dpgRekapTemuanSelectAll=dpgRekapTemuanSelectAll;"
          s=s.replace(expose,extra,1)
          close="""  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', dpgBoot);"""
          closecode="""  document.addEventListener('click',function(ev){var ms=_el('dpgRekapTemuanMs');if(ms&&ms.classList.contains('open')&&!ms.contains(ev.target)){ms.classList.remove('open');var btn=ms.querySelector('.dpg-ms-btn');if(btn)btn.setAttribute('aria-expanded','false');}});\n\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', dpgBoot);"""
          s=s.replace(close,closecode,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          grep -q 'dpgRekapTemuanSelectAll' SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html
          grep -q 'selectedMap' SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Teknik/Tek-Data-Checkpoint.html
          git commit -m "feat(checkpoint): add Temuan multiselect filter"
          git push origin HEAD:feat/checkpoint-temuan-multiselect
