name: Patch Jadwal Ampere ENS
on:
  push:
    branches: [fix/jadwal-padam-ampere-ens-units-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-ampere-ens-units-v2
      - run: python .github/scripts/patch_jadwal_ampere_ens.py
      - run: |
          grep -q 'ENS (MWh)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q "master.arus,'Beban (A)'" SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "fix(web): use amperage for Beban and label ENS MWh [skip ci]" || exit 0
          git push origin fix/jadwal-padam-ampere-ens-units-v2
