name: Patch Jadwal WA Report
on:
  push:
    branches: [feat/jadwal-padam-whatsapp-report]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jadwal-padam-whatsapp-report
      - run: python .github/scripts/patch_jadwal_wa_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "feat(web): add combined WhatsApp outage report [skip ci]" || exit 0
          git push origin feat/jadwal-padam-whatsapp-report
