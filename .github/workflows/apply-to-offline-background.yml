name: Apply TO offline background sync
on:
  push:
    branches:
      - main
      - feat/to-offline-background-sync
    paths:
      - scripts/patch_to_offline_background.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: python scripts/patch_to_offline_background.py
      - name: Verify patch
        run: |
          grep -q "workmanager:" SiSi_Mobile/pubspec.yaml
          grep -q "schemaVersion => 8" SiSi_Mobile/lib/db/app_database.dart
          grep -q "AutoSyncService.activate" SiSi_Mobile/lib/widgets/sync_section_pengaturan.dart
          grep -q "WidgetsBindingObserver" SiSi_Mobile/lib/screens/dashboard_screen.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_Mobile
          git diff --cached --quiet && exit 0
          git commit -m "feat(mobile): activate background sync after first manual sync"
          git push origin HEAD:${{ github.ref_name }}
