name: Wire Teknik TO menus
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-teknik-to-menus.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch dashboard source
        run: python .github/scripts/wire_teknik_to_menus.py
      - name: Commit dashboard source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_Mobile/lib/screens/dashboard_screen.dart
          git commit -m "fix: show TO assignment menus in Teknik" || exit 0
          git push origin main
