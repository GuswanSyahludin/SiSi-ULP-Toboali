name: Remove Hidden ULP Filter
on:
  push:
    branches: [fix/jadwal-padam-remove-hidden-ulp-filter]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-remove-hidden-ulp-filter
      - run: python .github/scripts/patch_remove_hidden_ulp.py
      - run: |
          ! grep -q "String(sesi.ulp||'')" SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "fix(web): remove hidden ULP filtering for regular users [skip ci]" || exit 0
          git push origin fix/jadwal-padam-remove-hidden-ulp-filter
