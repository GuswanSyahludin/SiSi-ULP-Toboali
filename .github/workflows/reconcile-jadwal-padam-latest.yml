name: Reconcile Jadwal Padam Latest Commit
on:
  push:
    branches: [fix/jadwal-padam-reconcile-latest-commit]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-reconcile-latest-commit
      - run: python .github/scripts/reconcile_jadwal_padam_latest.py
      - run: |
          grep -q 'Beban (A)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'ENS (Rupiah)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'text-overflow:ellipsis' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          test "$(grep -c 'var JADWAL_PADAM_TARIF_KWH = 1444.70;' SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js)" = 1
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "fix(web): reconcile Jadwal Padam after formatter commit [skip ci]" || exit 0
          git push origin fix/jadwal-padam-reconcile-latest-commit
