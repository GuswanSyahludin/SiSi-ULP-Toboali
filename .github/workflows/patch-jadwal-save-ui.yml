name: Patch Jadwal Save UI
on:
  push:
    branches: [feat/jadwal-padam-save-to-sheet]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jadwal-padam-save-to-sheet
      - run: python .github/scripts/patch_jadwal_save_ui.py
      - run: |
          grep -q 'simpanJadwalPadam(payload)' SiSi_BackEnd/Teknik/Jadwal-Padam.html
          grep -q 'id="jpSaveBtn"' SiSi_BackEnd/Teknik/Jadwal-Padam.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html
          git commit -m "feat(web): wire Jadwal Padam Save button [skip ci]" || exit 0
          git push origin feat/jadwal-padam-save-to-sheet
