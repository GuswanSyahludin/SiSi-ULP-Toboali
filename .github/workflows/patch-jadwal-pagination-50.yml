name: Patch Jadwal Pagination 50
on:
  push:
    branches: [fix/jadwal-padam-pagination-50]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-pagination-50
      - run: python .github/scripts/patch_jadwal_pagination_50.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam.html SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "feat(web): require date range and paginate 50 rows [skip ci]" || exit 0
          git push origin fix/jadwal-padam-pagination-50
