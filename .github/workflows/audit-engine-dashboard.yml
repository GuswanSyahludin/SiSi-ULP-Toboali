name: Audit Mobile

on:
  push:
    branches: [feat/engine-usage-dashboard]
    paths:
      - "SiSi_Mobile/**"
      - ".github/workflows/audit-engine-dashboard.yml"
  pull_request:
    paths:
      - "SiSi_Mobile/**"
      - ".github/workflows/audit-engine-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: SiSi_Mobile
        run: flutter pub get
      - working-directory: SiSi_Mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - working-directory: SiSi_Mobile
        run: flutter build apk --debug
