name: Patch Status Header Alias
on:
  push:
    branches: [fix/jadwal-padam-status-column-alias]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jadwal-padam-status-column-alias
      - run: python .github/scripts/patch_status_header_alias.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_BackEnd/Teknik/Jadwal-Padam-Code.js
          git commit -m "fix(web): support Status Jadwal Padam header [skip ci]" || exit 0
          git push origin fix/jadwal-padam-status-column-alias
