name: Fix Teknik TO casts
on:
  push:
    branches: [fix/teknik-to-unnecessary-casts]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teknik-to-unnecessary-casts
      - run: python .github/scripts/fix_teknik_to_casts.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: SiSi_Mobile
        run: flutter pub get
      - working-directory: SiSi_Mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SiSi_Mobile/lib/screens/teknik_to_screen.dart
          git commit -m "fix(teknik): remove unnecessary result casts [skip ci]" || exit 0
          git push origin fix/teknik-to-unnecessary-casts
