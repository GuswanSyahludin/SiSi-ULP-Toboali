name: Apply checkpoint dropdown fix
on:
  push:
    branches: [fix/checkpoint-penyulang-dropdown]
    paths: [.github/workflows/apply-checkpoint-dropdown-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkpoint-penyulang-dropdown
      - name: Patch token-aware dropdown endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SiSi_BackEnd/Core/Tek-Temuan-Code.js')
          s=p.read_text()
          replacements={
          "function getListTemuanByObjek(objek){\n  try{\n    var key = String(objek||'').trim().toLowerCase();": "function getListTemuanByObjek(token, objek){\n  try{\n    guard_(arguments, { ulp:true, aksi:'getListTemuanByObjek' });\n    var key = String(objek||'').trim().toLowerCase();",
          "function getListTemuanByTier(objek){ return getListTemuanByObjek(objek); }": "function getListTemuanByTier(token, objek){ return getListTemuanByObjek(token, objek); }",
          "function getDataPenyulangByUlp(ulp){\n  try{\n    var u = String(ulp||'').trim().toLowerCase();": "function getDataPenyulangByUlp(token, ulp){\n  try{\n    var g = guard_(arguments, { ulp:true, aksi:'getDataPenyulangByUlp' });\n    var scope = ulpScope_(g, ulp) || g.ulp;\n    var u = String(scope||'').trim().toLowerCase();",
          "var res = { ok:true, ulp:ulp, list:list };\n    cache.put(ck, JSON.stringify(res), 600);\n    return res;\n  }catch(e){ return { ok:false, error:String(e) }; }\n}\n\n/* ---------- Section per Penyulang": "var res = { ok:true, ulp:scope, list:list };\n    cache.put(ck, JSON.stringify(res), 600);\n    return res;\n  }catch(e){ return { ok:false, error:String(e), list:[] }; }\n}\n\n/* ---------- Section per Penyulang",
          "function getSectionByPenyulang(penyulang){\n  try{\n    var p = String(penyulang||'').trim().toLowerCase();": "function getSectionByPenyulang(token, penyulang){\n  try{\n    guard_(arguments, { ulp:true, aksi:'getSectionByPenyulang' });\n    var p = String(penyulang||'').trim().toLowerCase();",
          "function getTitikByPenyulang(penyulang){\n  try{\n    var sec = getSectionByPenyulang(penyulang);": "function getTitikByPenyulang(token, penyulang){\n  try{\n    guard_(arguments, { ulp:true, aksi:'getTitikByPenyulang' });\n    var sec = getSectionByPenyulang(token, penyulang);"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit('marker missing: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add regression test
        shell: bash
        run: |
          cat > tests/checkpoint-dropdown-token.test.cjs <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const source = fs.readFileSync('SiSi_BackEnd/Core/Tek-Temuan-Code.js','utf8');
          test('checkpoint dropdown endpoints accept injected token before filters',()=>{
            assert.match(source,/function getDataPenyulangByUlp\(token, ulp\)/);
            assert.match(source,/function getSectionByPenyulang\(token, penyulang\)/);
            assert.match(source,/function getTitikByPenyulang\(token, penyulang\)/);
            assert.match(source,/function getListTemuanByObjek\(token, objek\)/);
          });
          test('checkpoint dropdown endpoints are session and ULP scoped',()=>{
            assert.match(source,/aksi:'getDataPenyulangByUlp'/);
            assert.match(source,/var scope = ulpScope_\(g, ulp\) \|\| g\.ulp/);
            assert.match(source,/aksi:'getSectionByPenyulang'/);
          });
          EOF
      - name: Commit patch
        shell: bash
        run: |
          node --check SiSi_BackEnd/Core/Tek-Temuan-Code.js
          node --test tests/checkpoint-dropdown-token.test.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SiSi_BackEnd/Core/Tek-Temuan-Code.js tests/checkpoint-dropdown-token.test.cjs
          git commit -m "fix(checkpoint): restore token-aware dropdown data"
          git push origin HEAD:fix/checkpoint-penyulang-dropdown
