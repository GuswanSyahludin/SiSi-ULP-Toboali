name: Audit engine secret rotation
on:
  push:
    branches: [security/rotate-engine-secrets]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-hardcoded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject known leaked literals
        run: |
          ! grep -R -n --include='*.js' --include='*.py' 'sisi-wm-2026\|sisi-pdf-2026' SiSi_BackEnd engines
      - name: Verify Script Properties bridge
        run: |
          grep -q 'WM_ENGINE_SECRET' SiSi_BackEnd/Core/Engine-Secrets.js
          grep -q 'PDF_ENGINE_SECRET' SiSi_BackEnd/Core/Engine-Secrets.js
          grep -q '_engineSecret_' SiSi_BackEnd/Yandal/Tek-Watermark.js
          grep -q '_engineSecret_' SiSi_BackEnd/Core/SIE-BA-Code.js
  engine-auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [wm-engine, row-pdf-engine, ba-pdf-engine]
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile engines/${{ matrix.engine }}/*.py
      - run: docker build -t sisi-${{ matrix.engine }}:audit engines/${{ matrix.engine }}
      - name: Verify missing secret is rejected
        run: |
          docker run -d --rm --name sisi-audit -p 18080:8080 sisi-${{ matrix.engine }}:audit
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/ && break; sleep 2; done
          case '${{ matrix.engine }}' in
            wm-engine) URL='http://127.0.0.1:18080/watermark'; METHOD='POST' ;;
            row-pdf-engine) URL='http://127.0.0.1:18080/row/rekap'; METHOD='GET' ;;
            ba-pdf-engine) URL='http://127.0.0.1:18080/ba/pengoperasian'; METHOD='POST' ;;
          esac
          CODE=$(curl -sS -o /tmp/body -w '%{http_code}' -X "$METHOD" -H 'Content-Type: application/json' -d '{}' "$URL")
          test "$CODE" = '403'
      - if: always()
        run: docker rm -f sisi-audit 2>/dev/null || true
