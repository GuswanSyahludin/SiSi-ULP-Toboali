<style>
  :root{ --primary-lt:#eff6ff; --gray:#64748b; --radius:10px; }
  [data-theme="dark"]{ --primary-lt:#16233d; --gray:#93a4c0; }

  body{ background-color:var(--bg); background-image:url('https://drive.google.com/thumbnail?id=1rfN5LJOjjx0t-rjuLquBe6Qsx7hfcqqV&sz=w1920'); background-size:cover; background-position:center; background-attachment:fixed; color:var(--text); font-family:'Segoe UI',sans-serif; font-size:14px; }
  [data-theme="dark"] body, body[data-theme="dark"]{ background-image:url('https://drive.google.com/thumbnail?id=1T76yS2vAnMufKEKkhQie2zZ4AYVIn1tD&sz=w1920'); }

  .ty-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .ty-header h2{margin:0;font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
  .ty-header h2 i{color:var(--primary);}
  .ty-header .ty-sub{font-size:12px;color:var(--gray);margin:2px 0 0;}

  .ty-container{padding:8px;}

  /* Filter bar */
  .ty-filter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .ty-field{display:flex;flex-direction:column;gap:5px;}
  .ty-field label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.03em;}
  .ty-field input,.ty-field select{
    border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;
    font-size:13px;min-width:150px;background:var(--surface);color:var(--text);outline:none;
    transition:border-color .15s,box-shadow .15s;}
  .ty-field input:focus,.ty-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,58,138,.12);}
  [data-theme="dark"] .ty-field input:focus,[data-theme="dark"] .ty-field select:focus{box-shadow:0 0 0 3px rgba(41,227,255,.15);}
  .ty-btn-filter{background:var(--primary);color:var(--on-primary);border:none;border-radius:8px;
    padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:filter .15s;}
  .ty-btn-filter:hover{filter:brightness(1.08);}
  .ty-btn-reset{background:var(--surface-2);color:var(--gray);border:1.5px solid var(--border);
    border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .ty-btn-reset:hover{background:var(--surface-3);color:var(--text-2);}

  /* Tabel hasil */
  .ty-count{font-size:12px;color:var(--gray);margin:0 0 8px;}
  .ty-tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;}
  table.ty-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.ty-table th,table.ty-table td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  table.ty-table th{background:var(--surface-2);font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;}
  table.ty-table tbody tr:hover{background:var(--primary-lt);}
  table.ty-table td.ty-c,table.ty-table th.ty-c{text-align:center;}
  .ty-rank{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 7px;border-radius:6px;font-weight:700;font-size:12px;background:var(--surface-2);color:var(--text-2);}
  .ty-rank.r1{background:#fde68a;color:#7c4a03;}
  .ty-rank.r2{background:#e2e8f0;color:#475569;}
  .ty-rank.r3{background:#fed7aa;color:#7c3a03;}
  .ty-sub2{font-size:11px;color:var(--gray);margin-left:6px;}
  .ty-eye{background:transparent;border:1.5px solid var(--border);border-radius:7px;width:32px;height:28px;cursor:pointer;color:var(--primary);}
  .ty-eye:hover{background:var(--primary-lt);border-color:var(--primary);}

  /* Modal detail performa (layout horizontal) */
  .ty-modal{position:fixed;inset:0;z-index:9998;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:10px;}
  .ty-modal.show{display:flex;}
  /* Panel dilebarkan (hingga 96vw / 1560px) agar sub-tabel rincian P0 terbaca tanpa scroll horizontal. */
  .ty-modal-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:1560px;width:96vw;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.28);}
  .ty-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .ty-modal-head h3{margin:0;font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
  .ty-modal-head h3 i{color:var(--primary);}
  .ty-modal-close{background:transparent;border:none;font-size:18px;color:var(--gray);cursor:pointer;padding:4px 10px;border-radius:6px;}
  .ty-modal-close:hover{background:var(--surface-2);color:var(--text);}
  .ty-modal-body{padding:14px 16px;overflow:auto;}
  .ty-row{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;}

  /* Tab performa: Ringkasan / Jenis Pekerjaan / Jam Efektif */
  .ty-tabs{display:flex;gap:2px;flex-wrap:wrap;margin:-14px -16px 12px;padding:0 10px;
    border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:-14px;z-index:2;}
  .ty-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 14px;
    font-size:12.5px;font-weight:600;color:var(--gray);cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;transition:color .15s,border-color .15s;}
  .ty-tab:hover{color:var(--text);}
  .ty-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  .ty-tabpane{display:none;}
  .ty-tabpane.show{display:block;}
  .ty-tabpane .ty-col{width:100%;box-sizing:border-box;}
  .ty-tabpane .ty-col-info{column-count:2;column-gap:26px;}
  .ty-tabpane .ty-col-info h4{column-span:all;}
  .ty-tabpane .ty-kv{break-inside:avoid;}
  .ty-tabpane .ty-col-pie .ty-pie{width:190px;height:190px;}
  .ty-tabpane .ty-legend{max-height:none;columns:2;column-gap:22px;font-size:12.5px;}
  .ty-tabpane .ty-legend li{break-inside:avoid;}
  .ty-tabpane .ty-shift-scroll{max-height:64vh;}
  @media (max-width:760px){
    .ty-tabpane .ty-col-info{column-count:1;}
    .ty-tabpane .ty-legend{columns:1;}
  }
  .ty-col{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .ty-col-info{flex:0 0 252px;min-width:230px;}
  .ty-col-pie{flex:0 0 272px;min-width:250px;}
  .ty-col-shift{flex:1 1 430px;min-width:320px;padding:0;overflow:hidden;}
  .ty-col h4{margin:0 0 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);}
  .ty-col-shift h4{padding:12px 12px 8px;}
  .ty-kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .ty-kv:last-child{border-bottom:none;}
  .ty-kv b{font-weight:700;color:var(--text);}
  .ty-kv span{color:var(--gray);}
  .ty-pie{width:150px;height:150px;border-radius:50%;margin:4px auto 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .ty-legend{list-style:none;margin:0;padding:0;font-size:12px;max-height:140px;overflow:auto;}
  .ty-legend li{display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--text-2);}
  .ty-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
  .ty-legend .ty-lg-n{margin-left:auto;font-weight:700;color:var(--text);white-space:nowrap;}
  .ty-shift-scroll{max-height:340px;overflow:auto;}
  table.ty-shift{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.ty-shift th,table.ty-shift td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;vertical-align:top;}
  table.ty-shift th{background:var(--surface);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);position:sticky;top:0;}
  table.ty-shift td.ty-c,table.ty-shift th.ty-c{text-align:center;}
  .ty-bar{position:relative;height:6px;border-radius:4px;background:var(--border);margin-top:4px;overflow:hidden;min-width:70px;}
  .ty-bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:4px;}

  /* Empty / loading */
  .ty-empty{text-align:center;padding:60px 20px;color:var(--gray);}
  .ty-empty i{font-size:40px;margin-bottom:12px;display:block;color:var(--text-muted);}
  .ty-empty p{font-size:14px;margin:0;}
  .ty-loading{text-align:center;padding:60px 20px;color:var(--gray);}
  .ty-loading i{font-size:32px;margin-bottom:12px;display:block;color:var(--primary);}

  /* Ringkasan sebagai kartu TETAP + 2 tab (Jenis Pekerjaan / Jam Efektif) */
  .ty-detail-wrap{display:flex;gap:14px;align-items:flex-start;}
  .ty-fixcard{flex:0 0 264px;position:sticky;top:0;align-self:flex-start;max-height:calc(94vh - 130px);overflow:auto;}
  .ty-fixcard .ty-col-info{width:100%;box-sizing:border-box;}
  .ty-detail-main{flex:1 1 auto;min-width:0;}
  .ty-maintabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:12px;position:sticky;top:0;background:var(--surface);z-index:2;}
  .ty-maintabs .ty-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--gray);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .15s,border-color .15s;}
  .ty-maintabs .ty-tab:hover{color:var(--text);}
  .ty-maintabs .ty-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  @media (max-width:760px){ .ty-detail-wrap{flex-direction:column;} .ty-fixcard{position:static;flex:1 1 auto;width:100%;max-height:none;} }

  /* Sub-tabel rincian P0 per shift */
  .ty-p0row > td{padding:0 !important;}
  .ty-p0wrap{padding:8px 12px 12px;background:var(--surface);border-top:2px solid var(--primary);overflow-x:auto;}
  table.ty-p0tbl{width:100%;min-width:860px;border-collapse:collapse;font-size:12px;background:var(--surface-2);border-radius:8px;overflow:hidden;}
  table.ty-p0tbl th,table.ty-p0tbl td{padding:6px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;vertical-align:top;}
  table.ty-p0tbl th{background:var(--surface-3);font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);position:sticky;top:0;}
  table.ty-p0tbl td.ty-c,table.ty-p0tbl th.ty-c{text-align:center;}
  /* Kolom teks panjang (Pekerjaan / Lokasi) boleh membungkus supaya tidak terpotong. */
  table.ty-p0tbl td.ty-w{white-space:normal;min-width:230px;line-height:1.35;}
</style>

<div class="ty-header">
  <div>
    <h2><i class="fa-solid fa-business-time"></i> Analisa Jam Efektif Petugas</h2>
    <p class="ty-sub">Efektivitas jam kerja petugas Yandal/Yantek per shift</p>
  </div>
</div>

<div class="ty-container">
  <!-- Filter bar: Bulan (periode db_Yandal_Rank) + Nama Petugas -->
  <div class="ty-filter">
    <div class="ty-field">
      <label>Bulan</label>
      <input type="month" id="ty_bulan"/>
    </div>
    <div class="ty-field">
      <label>Nama Petugas</label>
      <select id="ty_petugas"><option value="">Semua Petugas</option></select>
    </div>
    <button class="ty-btn-filter" onclick="tyMuat()"><i class="fa-solid fa-magnifying-glass"></i> Muat</button>
    <button class="ty-btn-reset" onclick="tyReset()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
  </div>

  <!-- Area hasil (diisi di langkah berikutnya) -->
  <div id="tyResult" style="display:none"></div>

  <!-- Empty state -->
  <div class="ty-empty" id="tyEmpty">
    <i class="fa-solid fa-business-time"></i>
    <p>Pilih bulan & petugas, lalu klik Muat.</p>
  </div>

  <!-- Loading state -->
  <div class="ty-loading" id="tyLoading" style="display:none">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Memuat data...</p>
  </div>

  <!-- Modal detail performa individu (horizontal) -->
  <div class="ty-modal" id="tyModal">
    <div class="ty-modal-panel">
      <div class="ty-modal-head">
        <h3 id="tyModalTitle"><i class="fa-solid fa-user-gear"></i> Performa Individu</h3>
        <button class="ty-modal-close" onclick="tyTutupDetail()" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="ty-modal-body" id="tyModalBody"></div>
    </div>
  </div>
</div>

<script>
var _tySession = {};
var _tyIsSuperAdmin = false;

function _tyEl(id){ return document.getElementById(id); }

// Periode aktif ('YYYY-MM') hasil pemuatan terakhir — dipakai modal detail sebagai acuan bulan.
var _tyPeriode = '';

// 'YYYY-MM' bulan berjalan (nilai default input type=month).
function _tyBulanIni(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1);
}

function _tyBoot(){
  // Sesi: utamakan window.__SISI_SESI__ (di-set Main saat _loadPage)
  var sesi = window.__SISI_SESI__ || {};
  _tySession = sesi;
  _tyIsSuperAdmin = (['Super User','Admin'].indexOf(String(sesi.role || '').trim()) !== -1);

  // Default filter: BULAN berjalan (sumber data = db_Yandal_Rank, kunci periode 'YYYY-MM')
  if(_tyEl('ty_bulan')) _tyEl('ty_bulan').value = _tyBulanIni();

  // Isi dropdown Nama Petugas
  _tyLoadPetugas();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _tyBoot);
else _tyBoot();

// ULP untuk membatasi daftar petugas: Super User/Admin = semua ULP, selain itu = ULP sesi.
function _tyUlpScope(){
  return _tyIsSuperAdmin ? '' : (_tySession.ulp || '');
}

// Load daftar petugas ke dropdown (backend getListPetugasYandal di Tek-Yandal.gs)
function _tyLoadPetugas(){
  if(typeof google === 'undefined') return;
  google.script.run.withSuccessHandler(function(res){
    var sel = _tyEl('ty_petugas'); if(!sel) return;
    var list = (res && res.list) ? res.list : [];
    var html = '<option value="">Semua Petugas</option>';
    for(var i=0;i<list.length;i++){ html += '<option value="'+_tyEsc(list[i])+'">'+_tyEsc(list[i])+'</option>'; }
    sel.innerHTML = html;
  }).withFailureHandler(function(err){
    // biarkan hanya opsi "Semua Petugas"
  }).getListPetugasYandal({ ulp: _tyUlpScope() });
}

function tyMuat(){
  var bulan   = _tyEl('ty_bulan')   ? _tyEl('ty_bulan').value   : '';
  var petugas = _tyEl('ty_petugas') ? _tyEl('ty_petugas').value : '';
  if(!/^\d{4}-\d{2}$/.test(bulan)){ tyToast('Pilih bulan dulu.', 'error'); return; }
  _tyPeriode = bulan;

  _tyEl('tyEmpty').style.display   = 'none';
  _tyEl('tyResult').style.display  = 'none';
  _tyEl('tyLoading').style.display = 'block';

  if(typeof google === 'undefined'){ _tyEl('tyLoading').style.display='none'; tyToast('Backend tidak tersedia.','error'); return; }
  // periode = kunci baris db_Yandal_Rank (YYYY-MM). Backend menyinkronkan sendiri bila periode belum ada.
  google.script.run
    .withSuccessHandler(function(res){ _tyEl('tyLoading').style.display='none'; _tyRenderTabel(res, bulan); })
    .withFailureHandler(function(err){ _tyEl('tyLoading').style.display='none'; tyToast('Gagal memuat: ' + (err && err.message ? err.message : err), 'error'); })
    .getTabelPetugasYandal({ periode: bulan, petugas: petugas, ulp: _tyUlpScope() });
}

// Simpan hasil terakhir agar tombol Detail bisa membaca data barisnya.
var _tyRows = [];

function _tyRankBadge(rank){
  if(!rank) return '<span class="ty-rank">&ndash;</span>';
  var cls = (rank === 1) ? ' r1' : (rank === 2) ? ' r2' : (rank === 3) ? ' r3' : '';
  return '<span class="ty-rank' + cls + '">#' + rank + '</span>';
}

// Render tabel dari db_Yandal_Rank (1 baris = 1 petugas pada periode bulan terpilih).
function _tyRenderTabel(res, periode){
  var box = _tyEl('tyResult');
  if(!res || !res.ok){
    _tyEl('tyEmpty').style.display = 'block';
    _tyEl('tyEmpty').innerHTML = '<i class="fa-solid fa-circle-exclamation"></i><p>' + _tyEsc((res && res.error) || 'Data gagal dimuat.') + '</p>';
    return;
  }
  _tyRows = res.list || [];
  var labelBln = res.bulanLabel || _tyFmtBulan(periode);
  if(!_tyRows.length){
    _tyEl('tyEmpty').style.display = 'block';
    _tyEl('tyEmpty').innerHTML = '<i class="fa-solid fa-inbox"></i><p>Belum ada baris <b>db_Yandal_Rank</b> untuk ' + _tyEsc(labelBln) + '.</p>';
    return;
  }

  var h = '<p class="ty-count"><i class="fa-solid fa-users"></i> ' + _tyRows.length + ' petugas &bull; sumber <b>db_Yandal_Rank</b> periode '
        + _tyEsc(labelBln)
        + ' &bull; rank sepanjang tahun: ' + _tyEsc(String(res.tahun || '-')) + '</p>';
  h += '<div class="ty-tablewrap"><table class="ty-table"><thead><tr>'
     + '<th class="ty-c">No</th><th>Nama</th><th>Unit</th>'
     + '<th class="ty-c">Shift</th><th class="ty-c">P0</th><th>Jam Efektif</th>'
     + '<th class="ty-c">Rank Bulanan</th><th class="ty-c">Rank Sepanjang Tahun</th>'
     + '<th class="ty-c">Detail</th></tr></thead><tbody>';
  for(var i=0;i<_tyRows.length;i++){
    var r = _tyRows[i];
    var tipB = 'Nilai Total = Jam ' + (r.nilaiJam || 0) + '% x55% + Shift ' + (r.nilaiShift || 0)
             + '% x15% + P0 ' + (r.nilaiP0 || 0) + '% x18% + VCC ' + (r.nilaiVCC || 0) + '% x12%';
    var tipT = 'Rata-rata Nilai Total ' + (r.bulanTerdata || 0) + ' bulan terdata; total point P0 ' + (r.pointTahunan || 0);
    h += '<tr>'
       + '<td class="ty-c">' + r.no + '</td>'
       + '<td>' + _tyEsc(r.nama) + '</td>'
       + '<td>' + _tyEsc(r.unit) + '</td>'
       + '<td class="ty-c">' + (r.jumlahShift || 0) + '</td>'
       + '<td class="ty-c">' + (r.jumlahP0 || 0) + '<span class="ty-sub2">' + (r.pointBulanan || 0) + ' pt</span></td>'
       + '<td>' + _tyEsc(r.jamEfektif || '-') + '<span class="ty-sub2">' + (r.persenEfektif || 0) + '%</span></td>'
       + '<td class="ty-c">' + _tyRankBadge(r.rankBulanan) + '<span class="ty-sub2" title="' + _tyEsc(tipB) + '">' + ((r.nilaiTotal != null ? r.nilaiTotal : 0) + '%') + '</span></td>'
       + '<td class="ty-c">' + _tyRankBadge(r.rankTahunan) + '<span class="ty-sub2" title="' + _tyEsc(tipT) + '">' + ((r.nilaiTahun || 0) + '%') + '</span></td>'
       + '<td class="ty-c"><button class="ty-eye" title="Lihat detail performa" onclick="tyDetail(' + i + ')"><i class="fa-solid fa-eye"></i></button></td>'
       + '</tr>';
  }
  h += '</tbody></table></div>';
  box.innerHTML = h;
  box.style.display = 'block';
}

// ===== Detail performa individu (modal popup horizontal) =====
// Data MENGIKUTI bulan filter: acuan = tanggal 1 periode terpilih (backend getDetailPerformaPetugasY).
var _tyWarna = ['#2563eb','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'];

function tyDetail(i){
  var r = _tyRows[i];
  if(!r) return;
  _tyEl('tyModalTitle').innerHTML = '<i class="fa-solid fa-user-gear"></i> ' + _tyEsc(r.nama)
    + '<span class="ty-sub2">' + _tyEsc(r.unit || '') + '</span>';
  _tyEl('tyModalBody').innerHTML = '<div class="ty-loading"><i class="fa-solid fa-spinner fa-spin"></i><p>Memuat performa...</p></div>';
  _tyEl('tyModal').classList.add('show');
  if(typeof google === 'undefined'){ return; }
  google.script.run
    .withSuccessHandler(_tyRenderDetail)
    .withFailureHandler(function(err){
      _tyEl('tyModalBody').innerHTML = '<div class="ty-empty"><i class="fa-solid fa-circle-exclamation"></i><p>'
        + _tyEsc(err && err.message ? err.message : err) + '</p></div>';
    })
    .getDetailPerformaPetugasY({ petugas: r.nama, ulp: _tyUlpScope(),
      acuan: (/^\d{4}-\d{2}$/.test(_tyPeriode) ? (_tyPeriode + '-01') : '') });
}

function tyTutupDetail(){ var m = _tyEl('tyModal'); if(m) m.classList.remove('show'); }

document.addEventListener('keydown', function(e){ if(e.key === 'Escape') tyTutupDetail(); });

// Pie chart murni CSS (conic-gradient) + legenda — tanpa library eksternal.
function _tyPie(items){
  var total = 0, i;
  for(i=0;i<items.length;i++) total += items[i].jumlah;
  if(!total) return '<p class="ty-count">Belum ada P0 bulan ini.</p>';
  var stops = [], legend = '', acc = 0;
  for(i=0;i<items.length;i++){
    var w = _tyWarna[i % _tyWarna.length];
    var pct = items[i].jumlah / total * 100;
    stops.push(w + ' ' + acc.toFixed(2) + '% ' + (acc + pct).toFixed(2) + '%');
    acc += pct;
    legend += '<li><span class="ty-dot" style="background:' + w + '"></span>' + _tyEsc(items[i].nama)
            + '<span class="ty-lg-n">' + items[i].jumlah + ' (' + pct.toFixed(0) + '%)</span></li>';
  }
  return '<div class="ty-pie" style="background:conic-gradient(' + stops.join(',') + ')"></div>'
       + '<ul class="ty-legend">' + legend + '</ul>';
}

function _tyRenderDetail(res){
  var body = _tyEl('tyModalBody');
  if(!res || !res.ok){
    body.innerHTML = '<div class="ty-empty"><i class="fa-solid fa-circle-exclamation"></i><p>'
      + _tyEsc((res && res.error) || 'Data gagal dimuat.') + '</p></div>';
    return;
  }
  if(res.kosong){
    body.innerHTML = '<div class="ty-empty"><i class="fa-solid fa-inbox"></i><p>Belum ada P0 untuk '
      + _tyEsc(res.petugas) + ' pada tahun ' + _tyEsc(String(res.tahun)) + '.</p></div>';
    return;
  }
  var s = res.ringkasan || {};

  // Kolom 1 — identitas, rank & ringkasan jam efektif
  var kol1 = '<div class="ty-col ty-col-info">'
    + '<h4>Ringkasan &bull; ' + _tyEsc(res.bulanLabel) + '</h4>'
    + '<div class="ty-kv"><span>Unit</span><b>' + _tyEsc(res.unit) + '</b></div>'
    + '<div class="ty-kv"><span>Tim</span><b>' + _tyEsc(res.tim) + '</b></div>'
    + '<div class="ty-kv"><span>Rank bulanan</span><b>#' + (res.rankBulanan || '-') + ' / ' + (res.totalPetugasBulan || 0) + '</b></div>'
    + '<div class="ty-kv"><span>Rank tahunan</span><b>#' + (res.rankTahunan || '-') + ' / ' + (res.totalPetugasTahun || 0) + '</b></div>'
    + '<div class="ty-kv"><span>Jumlah shift</span><b>' + (s.jumlahShiftBulan || 0) + '</b></div>'
    + '<div class="ty-kv"><span>Jumlah P0</span><b>' + (s.jumlahP0Bulan || 0) + '</b></div>'
    + '<div class="ty-kv"><span>Jam kerja (shift &times; 8j)</span><b>' + _tyEsc(s.jamKerjaBulanStr || '-') + '</b></div>'
    + '<div class="ty-kv"><span>Jam efektif (bersih)</span><b>' + _tyEsc(s.jamEfektifBulanStr || '-') + '</b></div>'
    + '<div class="ty-kv"><span title="Jumlah kolom Durasi seluruh P0 sebelum interval tumpang tindih digabung">Durasi Total Pekerjaan</span><b>' + _tyEsc(s.jamKotorBulanStr || '-') + '</b></div>'
    + '<div class="ty-kv"><span>% Efektif</span><b>' + (s.persenBulan || 0) + '%</b></div>'
    + '<div class="ty-kv"><span>Rata-rata / P0</span><b>' + _tyEsc(s.rataPerP0BulanStr || '-') + '</b></div>'
    + '<div class="ty-kv"><span>Point</span><b>' + (s.pointBulan || 0) + '</b></div>'
    + (res.nilai
        ? '<h4 style="margin:12px 0 8px">Nilai Rank &bull; ' + _tyEsc(res.bulanLabel) + '</h4>'
          + '<div class="ty-kv"><span>Kode Rank</span><b>' + _tyEsc(res.nilai.kodeRank || '-') + '</b></div>'
          + '<div class="ty-kv"><span>% Nilai P0</span><b>' + res.nilai.nilaiP0 + '%</b></div>'
          + '<div class="ty-kv"><span>% Nilai Jam Efektif</span><b>' + res.nilai.nilaiJam + '%</b></div>'
          + '<div class="ty-kv"><span>% Nilai VCC</span><b>' + res.nilai.nilaiVCC + '%</b></div>'
          + '<div class="ty-kv"><span>Nilai Total</span><b>' + res.nilai.nilaiTotal + '%</b></div>'
        : '')
    + '<h4 style="margin:12px 0 8px">Tahun ' + _tyEsc(String(res.tahun)) + '</h4>'
    + '<div class="ty-kv"><span>Shift / P0</span><b>' + (s.jumlahShiftTahun || 0) + ' / ' + (s.jumlahP0Tahun || 0) + '</b></div>'
    + '<div class="ty-kv"><span>Jam efektif</span><b>' + _tyEsc(s.jamEfektifTahunStr || '-') + '</b></div>'
    + '<div class="ty-kv"><span>% Efektif</span><b>' + (s.persenTahun || 0) + '%</b></div>'
    + '<div class="ty-kv"><span>Total point</span><b>' + (s.pointTahun || 0) + '</b></div>'
    + '</div>';

  // Kolom 2 — pie chart komposisi jenis pekerjaan
  var kol2 = '<div class="ty-col ty-col-pie"><h4>Jenis Pekerjaan P0 &bull; ' + _tyEsc(res.bulanLabel) + '</h4>'
           + _tyPie(res.pekerjaan || []) + '</div>';

  // Kolom 3 — rincian per shift: jam mulai–selesai & jam efektif
  var rows = '', list = res.shift || [];
  for(var i=0;i<list.length;i++){
    var it = list[i];
    var pct = Math.min(100, it.persen || 0);
    rows += '<tr>'
      + '<td>' + _tyEsc(it.tanggal) + '<br><span class="ty-sub2" style="margin:0">' + _tyEsc(it.hari || '') + '</span></td>'
      + '<td>' + _tyEsc(it.shift) + '<br><span class="ty-sub2" style="margin:0">' + _tyEsc(it.shiftJam || '') + '</span></td>'
      + '<td class="ty-c">' + _tyEsc(it.jamMulai) + ' &ndash; ' + _tyEsc(it.jamSelesai)
      + '<br><span class="ty-sub2" style="margin:0">rentang ' + _tyEsc(it.rentangStr) + '</span></td>'
      + '<td class="ty-c">' + it.jumlahP0 + '</td>'
      + '<td>' + _tyEsc(it.jamEfektifStr)
      + (it.overlap ? ' <i class="fa-solid fa-layer-group ty-sub2" title="Ada P0 yang waktunya tumpang tindih — dihitung sekali. Durasi Total Pekerjaan: ' + _tyEsc(it.jamKotorStr) + '"></i>' : '')
      + '<div class="ty-bar"><i style="width:' + pct + '%"></i></div></td>'
      + '<td class="ty-c">' + (it.persen || 0) + '%</td>'
      + '<td class="ty-c">' + (it.point || 0) + '</td>'
      + '<td class="ty-c">' + ((it.p0List && it.p0List.length) ? '<button class="ty-eye" title="Lihat rincian P0 shift ini" onclick="tyP0Detail(' + i + ')"><i class="fa-solid fa-list-ul"></i></button>' : '&ndash;') + '</td>'
      + '</tr>';
    rows += '<tr class="ty-p0row" id="typ0_' + i + '" style="display:none"><td colspan="8">' + _tyP0Tabel(it.p0List) + '</td></tr>';
  }
  var kol3 = '<div class="ty-col ty-col-shift"><h4>Jam Efektif per Shift &bull; ' + _tyEsc(res.bulanLabel) + '</h4>'
    + '<div class="ty-shift-scroll"><table class="ty-shift"><thead><tr>'
    + '<th>Tanggal</th><th>Shift</th><th class="ty-c">Mulai &ndash; Selesai</th><th class="ty-c">P0</th>'
    + '<th>Jam Efektif</th><th class="ty-c">%</th><th class="ty-c">Point</th><th class="ty-c">Detail</th>'
    + '</tr></thead><tbody>'
    + (rows || '<tr><td colspan="8">Belum ada shift bulan ini.</td></tr>')
    + '</tbody></table></div></div>';

  // Ringkasan = kartu TETAP (selalu tampil). Sisanya 2 tab: Jenis Pekerjaan / Jam Efektif.
  var navTab = '<div class="ty-maintabs">'
    + '<button class="ty-tab active" data-tab="2" onclick="tyTab(2)"><i class="fa-solid fa-chart-pie"></i> Jenis Pekerjaan</button>'
    + '<button class="ty-tab" data-tab="3" onclick="tyTab(3)"><i class="fa-solid fa-clock"></i> Jam Efektif</button>'
    + '</div>';

  body.innerHTML = '<div class="ty-detail-wrap">'
    + '<div class="ty-fixcard">' + kol1 + '</div>'
    + '<div class="ty-detail-main">' + navTab
    + '<div class="ty-tabpane show" data-pane="2">' + kol2 + '</div>'
    + '<div class="ty-tabpane" data-pane="3">' + kol3 + '</div>'
    + '</div></div>';
  body.scrollTop = 0;
}

// Ganti tab aktif pada modal performa individu.
function tyTab(n){
  var body = _tyEl('tyModalBody'); if(!body) return;
  var tabs = body.querySelectorAll('.ty-tab');
  var panes = body.querySelectorAll('.ty-tabpane');
  var i;
  for(i=0;i<tabs.length;i++){
    if(tabs[i].getAttribute('data-tab') === String(n)) tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  for(i=0;i<panes.length;i++){
    if(panes[i].getAttribute('data-pane') === String(n)) panes[i].classList.add('show');
    else panes[i].classList.remove('show');
  }
  body.scrollTop = 0;
}

// ===== Rincian P0 per shift (tabel Detail di tab Jam Efektif) =====
function tyP0Detail(n){
  var el = document.getElementById('typ0_' + n);
  if(!el) return;
  el.style.display = (el.style.display === 'none' || !el.style.display) ? 'table-row' : 'none';
}
function _tyStatusBadge(s){
  s = String(s == null ? '' : s).trim();
  if(!s) return '&ndash;';
  var c = (s === 'Approved') ? '#16a34a' : (s === 'Rejected' ? '#dc2626' : 'var(--gray)');
  return '<span style="color:' + c + ';font-weight:600">' + _tyEsc(s) + '</span>';
}
function _tyP0Tabel(list){
  list = list || [];
  if(!list.length) return '<div class="ty-count" style="padding:10px 14px;margin:0">Tidak ada rincian P0.</div>';
  var h = '<div class="ty-p0wrap"><table class="ty-p0tbl"><thead><tr>'
    + '<th class="ty-c">#</th><th>Pekerjaan</th><th>Lokasi</th>'
    + '<th class="ty-c">Mulai</th><th class="ty-c">Selesai</th><th class="ty-c">Durasi</th>'
    + '<th class="ty-c">Point</th><th class="ty-c">Status</th></tr></thead><tbody>';
  for(var i=0;i<list.length;i++){
    var p = list[i];
    var lok = [p.penyulang, p.section, p.daerah].filter(function(x){ return x; }).join(' / ') || '-';
    h += '<tr>'
      + '<td class="ty-c">' + (i + 1) + '</td>'
      + '<td class="ty-w">' + _tyEsc(p.pekerjaan) + '<br><span class="ty-sub2" style="margin:0">' + _tyEsc(p.kodeP0 || '') + '</span></td>'
      + '<td class="ty-w">' + _tyEsc(lok) + '</td>'
      + '<td class="ty-c">' + _tyEsc(p.jamMulai) + '</td>'
      + '<td class="ty-c">' + _tyEsc(p.jamSelesai) + '</td>'
      + '<td class="ty-c">' + _tyEsc(p.durasiStr) + '</td>'
      + '<td class="ty-c">' + (p.point || 0) + '</td>'
      + '<td class="ty-c">' + _tyStatusBadge(p.status) + '</td>'
      + '</tr>';
  }
  h += '</tbody></table></div>';
  return h;
}

function tyReset(){
  if(_tyEl('ty_bulan'))   _tyEl('ty_bulan').value   = _tyBulanIni();
  if(_tyEl('ty_petugas')) _tyEl('ty_petugas').value = '';
  _tyPeriode = '';
  _tyEl('tyResult').style.display = 'none';
  _tyEl('tyEmpty').style.display  = 'block';
  _tyEl('tyEmpty').innerHTML = '<i class="fa-solid fa-business-time"></i><p>Pilih bulan & petugas, lalu klik Muat.</p>';
}

// 'YYYY-MM' → 'Juli 2026' (label periode db_Yandal_Rank).
function _tyFmtBulan(periode){
  var m = String(periode || '').match(/^(\d{4})-(\d{2})$/);
  if(!m) return String(periode || '-');
  var bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return (bln[Number(m[2]) - 1] || m[2]) + ' ' + m[1];
}

function _tyFmtTgl(tgl){
  if(!tgl) return '-';
  var d = new Date(tgl);
  if(isNaN(d)) return tgl;
  var bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return d.getDate() + ' ' + bln[d.getMonth()] + ' ' + d.getFullYear();
}

function _tyEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function tyToast(msg, type){
  if(typeof showToast === 'function'){ showToast(msg, type || 'warning'); return; }
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;'
    + 'display:flex;align-items:center;gap:10px;'
    + 'background:' + (type === 'error' ? 'rgba(220,38,38,.15)' : 'rgba(245,166,35,.15)') + ';'
    + 'border:1.5px solid ' + (type === 'error' ? 'var(--danger)' : 'var(--warning)') + ';'
    + 'color:' + (type === 'error' ? 'var(--danger)' : 'var(--warning)') + ';'
    + 'padding:12px 18px;border-radius:10px;font-size:.87rem;font-weight:600;'
    + 'box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:340px;';
  t.innerHTML = '<i class="fa-solid ' + (type === 'error' ? 'fa-circle-xmark' : 'fa-triangle-exclamation') + '"></i><span>' + _tyEsc(msg) + '</span>';
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 3500);
}
</script>
